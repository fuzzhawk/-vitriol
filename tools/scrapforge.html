<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCRAP FORGE — physics debris</title>
<style>
:root{--bg:#0a0c0d;--bg2:#101314;--panel:#141719;--line:#1e2325;--line2:#2b3235;
  --ink:#c8d2d6;--dim:#6e7c84;--amber:#f0a830;--steel:#8aa0b4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:12px/1.45 "Courier New",monospace;overflow:hidden}
.app{display:flex;height:100%}
.rail{width:272px;flex:0 0 272px;border-right:1px solid var(--line);background:var(--bg2);
  overflow-y:auto;padding:10px 12px 40px}
.head h1{margin:0;font-size:14px;letter-spacing:6px;color:var(--steel);font-weight:700}
.head p{margin:4px 0 12px;color:var(--dim);font-size:10px;letter-spacing:2px}
.grp{border:1px solid var(--line);background:var(--panel);margin-bottom:8px}
.grp-h{padding:7px 10px;border-bottom:1px solid var(--line);background:#1a1e20}
.grp-h b{font-size:10px;letter-spacing:3px;color:var(--amber)}
.grp-b{padding:7px 10px 9px}
.ctl{display:flex;align-items:center;gap:8px;padding:2px 0;min-height:21px}
.ctl label{flex:0 0 96px;color:var(--dim);font-size:10.5px}
.ctl select{flex:1;background:#0d1011;border:1px solid var(--line2);color:var(--ink);
  padding:3px 5px;font:inherit;font-size:10.5px;min-width:0}
.ctl input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:16px;background:transparent;min-width:0}
.ctl input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line2)}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:14px;
  background:var(--amber);margin-top:-6px;border:none}
.ctl .val{flex:0 0 48px;text-align:right;color:var(--amber);font-size:10px}
.ctl .chk{flex:1}.ctl .chk input{accent-color:var(--amber)}
.row{display:flex;gap:6px;margin-top:7px}
button{background:#22282b;border:1px solid var(--line2);color:var(--ink);padding:7px 10px;
  font:inherit;font-size:10.5px;letter-spacing:2px;cursor:pointer;flex:1}
button:hover{background:#2c3438}
button.primary{background:var(--steel);border-color:var(--steel);color:#0b1116;font-weight:700}
.stage{flex:1;display:flex;flex-direction:column;min-width:0}
.modebar{display:flex;border-bottom:1px solid var(--line);background:#141719}
.modebar button{flex:1;border:none;border-right:1px solid var(--line);background:transparent;
  color:var(--dim);padding:9px 6px;letter-spacing:3px}
.modebar button.on{background:#1f2426;color:var(--amber);box-shadow:inset 0 -2px 0 var(--amber)}
.view{flex:1;overflow:auto;padding:16px;background:
  repeating-conic-gradient(#191c1e 0% 25%,#141718 0% 50%) 50%/16px 16px}
.view canvas{image-rendering:pixelated;display:block;margin:0 auto;
  box-shadow:0 0 0 1px #262c2f,0 12px 40px rgba(0,0,0,.6)}
.foot{border-top:1px solid var(--line);background:#101314;padding:7px 12px;display:flex;
  gap:18px;font-size:10px;color:var(--dim)}
.foot span{color:var(--amber)}
.hide{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <div class="head"><h1>SCRAP FORGE</h1><p>PHYSICS DEBRIS &amp; CONTAINERS</p></div>
    <div id="rail"></div>
  </div>
  <div class="stage">
    <div class="modebar">
      <button id="mb-all" class="on">ALL KINDS</button>
      <button id="mb-one">SHEET</button>
      <button id="mb-phys">PHYSICS BAKE</button>
    </div>
    <div class="view">
      <canvas id="all" width="900" height="300"></canvas>
      <canvas id="one" class="hide"></canvas>
      <canvas id="phys" class="hide"></canvas>
    </div>
    <div class="foot">
      <div>CELL <span id="f_cell">—</span></div>
      <div>MASS <span id="f_mass">—</span></div>
      <div>HULL <span id="f_hull">—</span></div>
      <div>BAKE <span id="f_ms">—</span></div>
    </div>
  </div>
</div>
<script>
"use strict";

/* ================================================================
   SCRAP FORGE — crates, drums and rubble that the physics can throw

   Same house pipeline as the other generators: draw into albedo +
   height + emissive at supersample, light from the height buffer,
   crush, then snap to a palette with edge shading and an outline.
   The grime comes out of the downscale.

   Two things make this generator different from a sprite tool.

   Columns are DAMAGE STATES, not animation frames: a prop that has
   been shot twice should look it, so each piece bakes intact,
   cracked and wrecked.

   And like CRAWLER FORGE it emits a physics bake — hull, half
   extents, mass, restitution and gib seeds — measured off the
   silhouette that was actually drawn, so the rigid body matches the
   pixels rather than approximating them.
   ================================================================ */

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeRng(seed){const r=mulberry32(seed>>>0);
  return{rnd:r,range:(a,b)=>a+r()*(b-a),int:(a,b)=>a+Math.floor(r()*(b-a+1)),
    pick:a=>a[Math.floor(r()*a.length)%a.length],chance:p=>r()<p};}
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rh(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function shade(h,a){const c=hx(h);if(a>=0)return rh(c[0]+(255-c[0])*a,c[1]+(255-c[1])*a,c[2]+(255-c[2])*a);
  return rh(c[0]*(1+a),c[1]*(1+a),c[2]*(1+a));}
function mkCanvas(w,h){const c=document.createElement('canvas');
  c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;}

function noiseField(rng,w,h,res,oct){
  const out=new Float32Array(w*h);
  let amp=1,tot=0,scale=res;
  for(let o=0;o<oct;o++){
    const gw=Math.max(2,Math.ceil(w/scale)+2),gh=Math.max(2,Math.ceil(h/scale)+2);
    const g=new Float32Array(gw*gh);
    for(let i=0;i<g.length;i++)g[i]=rng.rnd();
    for(let y=0;y<h;y++){const fy=y/scale,y0=Math.floor(fy),ty=smooth(fy-y0);
      for(let x=0;x<w;x++){const fx=x/scale,x0=Math.floor(fx),tx=smooth(fx-x0);
        const a=g[y0*gw+x0],b=g[y0*gw+x0+1],c=g[(y0+1)*gw+x0],d=g[(y0+1)*gw+x0+1];
        out[y*w+x]+=amp*lerp(lerp(a,b,tx),lerp(c,d,tx),ty);}}
    tot+=amp;amp*=0.5;scale*=0.5;if(scale<1.5)break;
  }
  for(let i=0;i<out.length;i++)out[i]/=tot;
  return out;
}
const sampleF=(f,w,h,x,y)=>f[clamp(y|0,0,h-1)*w+clamp(x|0,0,w-1)];

/* ---------------- palettes ---------------- */
const PALETTES={
  rust:    {label:'Rust',      body:['#7a4a2e','#a3673c','#3f2416'],trim:['#8a8079','#b5aba1','#4a443e'],
            mark:'#d2932a',dark:'#241408'},
  steel:   {label:'Steel',     body:['#5e6a74','#8595a3','#333c44'],trim:['#7d8794','#aab6c2','#434b53'],
            mark:'#e0a02a',dark:'#151a1f'},
  concrete:{label:'Concrete',  body:['#6e6a62','#959086','#3c3a32'],trim:['#7d7468','#a89c8c','#463f36'],
            mark:'#b8442a',dark:'#1c1a17'},
  crate:   {label:'Crate',     body:['#7d5c35','#a37c4a','#42301b'],trim:['#5e6a74','#8595a3','#333c44'],
            mark:'#d2b24a',dark:'#20160c'},
  hazard:  {label:'Hazard',    body:['#8a7028','#b8973a','#453718'],trim:['#4a4a4a','#6e6e6e','#282828'],
            mark:'#e0d02a',dark:'#181405'},
  toxic:   {label:'Toxic drum',body:['#3f6a3a','#5c9a52','#22401f'],trim:['#6e7a68','#96a48e','#363d33'],
            mark:'#9cff5a',dark:'#141c12'},
  bone:    {label:'Ash',       body:['#6a6660','#8f8a82','#3a3833'],trim:['#7a736a','#9e968a','#413b34'],
            mark:'#c0b4a0',dark:'#191715'}
};
for(const k in PALETTES){                       // scrub anything malformed
  const S=PALETTES[k],fix=v=>/^#[0-9a-f]{6}$/i.test(v)?v:'#808080';
  S.body=S.body.map(fix);S.trim=S.trim.map(fix);S.mark=fix(S.mark);S.dark=fix(S.dark);
}

const KINDS=['crate','drum','slab','girder','bale','panel'];

/* Control schema, kept with the parameters so the game can generate a
   panel from the same table the tool uses. */
const CONTROLS=[
 {g:'PIECE',c:[
  {k:'kind',l:'kind',t:'s',opt:()=>KINDS},
  {k:'size',l:'size',t:'r',min:8,max:40,step:1,fmt:v=>v+'px'},
  {k:'palette',l:'palette',t:'s',opt:()=>Object.keys(PALETTES)},
  {k:'dmgFrames',l:'damage states',t:'r',min:1,max:4,step:1}
 ]},
 {g:'SURFACE',c:[
  {k:'grime',l:'grime',t:'r',min:0,max:1.5,step:0.05},
  {k:'grit',l:'grit',t:'r',min:0,max:1.5,step:0.05},
  {k:'wear',l:'wear',t:'r',min:0,max:1.5,step:0.05},
  {k:'markings',l:'markings',t:'r',min:0,max:1.5,step:0.05},
  {k:'chip',l:'chipping',t:'r',min:0,max:1.5,step:0.05}
 ]},
 {g:'RENDER',c:[
  {k:'rim',l:'rim light',t:'r',min:0,max:0.6,step:0.02},
  {k:'shadow',l:'shadow',t:'r',min:0,max:0.6,step:0.02},
  {k:'relief',l:'relief',t:'r',min:0,max:2,step:0.05},
  {k:'lightdir',l:'light angle',t:'r',min:0,max:359,step:1,fmt:v=>v+'°'},
  {k:'outline',l:'outline',t:'c'},
  {k:'shading',l:'edge shading',t:'c'},
  {k:'__buttons',t:'buttons'}
 ]}
];

const P={
  seed:2214, kind:'crate', size:20, palette:'crate',
  chip:0.7, grime:0.85, grit:0.9, wear:0.7, markings:0.8,
  rim:0.26, shadow:0.34, relief:1.0, lightdir:300,
  dmgFrames:3, outline:true, shading:true, SS:4
};

/* ---------------- palette ---------------- */
function buildPalette(){
  const S=PALETTES[P.palette]||PALETTES.crate;
  const fams=[S.body[0],S.body[1],S.body[2],S.trim[0],S.trim[1],S.trim[2],S.mark,S.dark];
  const list=[],rampOf=[],posOf=[];
  const push=hex=>{const c=hx(hex);list.push({r:c[0],g:c[1],b:c[2]});return list.length-1;};
  for(const f of fams){
    const ramp=[push(shade(f,-P.shadow*1.55)),push(shade(f,-P.shadow)),push(f),
                push(shade(f,P.rim)),push(shade(f,P.rim*1.32))];
    ramp.forEach((i,k)=>{rampOf[i]=ramp;posOf[i]=k;});
  }
  const matchCount=list.length;
  const o=push('#0a0809');rampOf[o]=[o,o,o,o,o];posOf[o]=2;
  const step=(i,n)=>{const r=rampOf[i];return r?r[clamp(posOf[i]+n,0,4)]:i;};
  return{list,rampOf,posOf,step,outline:o,matchCount,S,cache:new Map()};
}
function nearest(pal,r,g,b){
  let best=0,bd=1e9;
  for(let i=0;i<pal.matchCount;i++){
    const c=pal.list[i],dr=c.r-r,dg=c.g-g,db=c.b-b;
    const d=dr*dr*0.35+dg*dg*0.5+db*db*0.15;
    if(d<bd){bd=d;best=i;}
  }
  return best;
}

/* ---------------- height lighting + crush ---------------- */
const BASE=128;
function blurBuf(src,w,h,r){
  const tmp=new Float32Array(w*h),out=new Float32Array(w*h);
  const R=Math.max(1,r|0),norm=1/(R*2+1);
  for(let y=0;y<h;y++){let acc=0;
    for(let x=-R;x<=R;x++)acc+=src[y*w+clamp(x,0,w-1)];
    for(let x=0;x<w;x++){tmp[y*w+x]=acc*norm;
      acc+=src[y*w+clamp(x+R+1,0,w-1)]-src[y*w+clamp(x-R,0,w-1)];}}
  for(let x=0;x<w;x++){let acc=0;
    for(let y=-R;y<=R;y++)acc+=tmp[clamp(y,0,h-1)*w+x];
    for(let y=0;y<h;y++){out[y*w+x]=acc*norm;
      acc+=tmp[clamp(y+R+1,0,h-1)*w+x]-tmp[clamp(y-R,0,h-1)*w+x];}}
  return out;
}
function lightPass(A,H,E,w,h){
  const ctx=A.getContext('2d');
  const img=ctx.getImageData(0,0,w,h),d=img.data;
  const em=E.getContext('2d').getImageData(0,0,w,h).data;
  const cav=blurBuf(H,w,h,Math.max(2,(w*0.07)|0));
  const rad=P.lightdir*Math.PI/180;
  const lx=Math.cos(rad),ly=Math.sin(rad),lz=0.72;
  const rel=P.relief*(w/110);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x,p=i*4;
    if(d[p+3]<8)continue;
    const hl=H[y*w+clamp(x-1,0,w-1)],hr=H[y*w+clamp(x+1,0,w-1)];
    const hu=H[clamp(y-1,0,h-1)*w+x],hd=H[clamp(y+1,0,h-1)*w+x];
    let nx=(hl-hr)*rel,ny=(hu-hd)*rel,nz=1;
    const il=1/Math.hypot(nx,ny,nz);nx*=il;ny*=il;nz*=il;
    const lam=clamp(nx*lx+ny*ly+nz*lz,0,1);
    const ao=clamp(0.55+(H[i]-cav[i])*2.6,0.30,1.18);
    const hx2=lx*0.5,hy2=ly*0.5,hz2=(lz+1)*0.5;
    const ih=1/Math.hypot(hx2,hy2,hz2);
    const sp=Math.pow(clamp(nx*hx2*ih+ny*hy2*ih+nz*hz2*ih,0,1),20)*0.8;
    const k=(0.34+0.78*lam)*ao;
    const eA=em[p+3]/255*0.85;
    d[p  ]=clamp(d[p  ]*k+sp*210+em[p  ]*eA,0,255);
    d[p+1]=clamp(d[p+1]*k+sp*210+em[p+1]*eA,0,255);
    d[p+2]=clamp(d[p+2]*k+sp*210+em[p+2]*eA,0,255);
  }
  ctx.putImageData(img,0,0);
  return A;
}
function crush(src,outW,outH){
  let cur=src;
  while(cur.width>outW*2&&cur.height>outH*2){
    const n=mkCanvas(Math.max(outW,cur.width>>1),Math.max(outH,cur.height>>1));
    const c=n.getContext('2d');
    c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
    c.drawImage(cur,0,0,n.width,n.height);
    cur=n;
  }
  const out=mkCanvas(outW,outH),oc=out.getContext('2d');
  oc.imageSmoothingEnabled=true;oc.imageSmoothingQuality='high';
  oc.drawImage(cur,0,0,outW,outH);
  return out;
}
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const NW=64;let NOISE=new Float32Array(NW*NW),NOISE_SEED=null;
function buildNoise(seed){
  if(NOISE_SEED===seed)return;NOISE_SEED=seed;
  const r=mulberry32(seed>>>0),g=new Float32Array(NW*NW);
  for(let i=0;i<g.length;i++)g[i]=r();
  for(let y=0;y<NW;y++)for(let x=0;x<NW;x++){
    const a=g[y*NW+x],b=g[y*NW+(x+1)%NW],c=g[((y+1)%NW)*NW+x];
    NOISE[y*NW+x]=a*0.7*1+b*0.16+c*0.14;
  }
}
function rasterise(ctx,w,h,pal,CW,CH){
  const img=ctx.getImageData(0,0,w,h),d=img.data,n=w*h;
  const idx=new Int16Array(n).fill(-1);
  for(let i=0,p=0;i<n;i++,p+=4){
    if(d[p+3]<115)continue;
    const key=(d[p]<<16)|(d[p+1]<<8)|d[p+2];
    let k=pal.cache.get(key);
    if(k===undefined){k=nearest(pal,d[p],d[p+1],d[p+2]);pal.cache.set(key,k);}
    idx[i]=k;
  }
  if(P.shading){
    const src=idx.slice();
    const gAmt=clamp(P.grit,0,1.5);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=y*w+x,c0=src[i];if(c0<0)continue;
      const up=y>0?src[i-w]:-1,dn=y<h-1?src[i+w]:-1;
      const up2=y>1?src[i-2*w]:-1,dn2=y<h-2?src[i+2*w]:-1;
      const lf=x>0?src[i-1]:-1,rt=x<w-1?src[i+1]:-1;
      let k=0;
      if(up<0)k+=2;else if(up2<0)k+=1;
      if(dn<0)k-=2;else if(dn2<0)k-=1;
      if(lf>=0&&pal.rampOf[lf]!==pal.rampOf[c0])k-=1;
      if(lf<0&&rt<0)k-=1;
      if(gAmt>0.01&&k===0){
        const nz=NOISE[((y%CH)%NW)*NW+((x%CW)%NW)];
        const t=(nz-0.5)*2*gAmt+((B4[(y&3)*4+(x&3)]+0.5)/16-0.5)*0.35;
        if(t>0.58)k+=1;else if(t<-0.58)k-=1;
      }
      if(k)idx[i]=pal.step(c0,k);
    }
  }
  if(P.outline){
    const src=idx.slice();
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=y*w+x;if(src[i]>=0)continue;
      if((x>0&&src[i-1]>=0)||(x<w-1&&src[i+1]>=0)||(y>0&&src[i-w]>=0)||(y<h-1&&src[i+w]>=0))
        idx[i]=pal.outline;
    }
  }
  for(let i=0,p=0;i<n;i++,p+=4){
    const k=idx[i];
    if(k<0){d[p+3]=0;continue;}
    const c=pal.list[k];d[p]=c.r;d[p+1]=c.g;d[p+2]=c.b;d[p+3]=255;
  }
  ctx.putImageData(img,0,0);
}

/* ================================================================
   THE PIECES

   Each kind draws into albedo/height/emissive at supersample in a
   local box, given a damage level 0..1. Damage is not a separate
   sprite: it chips the silhouette, opens the seams and spills the
   contents, so a crate that has been shot reads as one that has been
   shot rather than one wearing a crack decal.
   ================================================================ */
function drawPiece(kind,dmg,A,Hc,E,W,H,rng,pal,grit){
  const S=pal.S;
  const a=A.getContext('2d'),hc=Hc.getContext('2d'),ec=E.getContext('2d');
  const hg=v=>{const c=clamp(v,0,255)|0;return'rgb('+c+','+c+','+c+')';};
  const M=Math.min(W,H);
  const pad=M*0.06;
  const x0=pad,y0=pad,x1=W-pad,y1=H-pad;
  const bw=x1-x0,bh=y1-y0;

  /* A body panel: fill + height block + a bevelled lip. */
  const panel=(px,py,pw,ph,col,hRaise,bevel)=>{
    a.fillStyle=col;a.fillRect(px,py,pw,ph);
    hc.fillStyle=hg(BASE+hRaise);hc.fillRect(px,py,pw,ph);
    if(bevel!==false){
      hc.fillStyle=hg(BASE+hRaise+34);hc.fillRect(px,py,pw,Math.max(1.5,M*0.02));
      hc.fillStyle=hg(BASE+hRaise-30);hc.fillRect(px,py+ph-Math.max(1.5,M*0.02),pw,Math.max(1.5,M*0.02));
    }
  };
  const band=(px,py,pw,ph,col,raise)=>{
    a.fillStyle=col;a.fillRect(px,py,pw,ph);
    hc.fillStyle=hg(BASE+raise);hc.fillRect(px,py,pw,ph);
    hc.fillStyle=hg(BASE+raise+40);hc.fillRect(px,py,pw,Math.max(1.2,M*0.014));
  };
  const bolt=(px,py,r)=>{
    a.fillStyle=shade(S.trim[1],0.10);
    a.beginPath();a.arc(px,py,r,0,TAU);a.fill();
    const g=hc.createRadialGradient(px,py,0,px,py,r*1.8);
    g.addColorStop(0,hg(BASE+72));g.addColorStop(0.6,hg(BASE+40));
    g.addColorStop(1,'rgba(128,128,128,0)');
    hc.fillStyle=g;hc.beginPath();hc.arc(px,py,r*1.8,0,TAU);hc.fill();
  };

  if(kind==='crate'){
    panel(x0,y0,bw,bh,S.body[0],26);
    // plank seams
    const nP=rng.int(3,5);
    for(let i=1;i<nP;i++){
      const yy=y0+bh*i/nP;
      a.fillStyle=shade(S.body[2],-0.05);
      a.fillRect(x0,yy-M*0.012,bw,M*0.024);
      hc.fillStyle=hg(BASE-16);hc.fillRect(x0,yy-M*0.012,bw,M*0.024);
    }
    // corner brackets
    const bwid=bw*0.22,bhei=bh*0.22;
    for(const [cx,cy] of [[x0,y0],[x1-bwid,y0],[x0,y1-bhei],[x1-bwid,y1-bhei]]){
      band(cx,cy,bwid,M*0.055,S.trim[0],40);
      band(cx,cy,M*0.055,bhei,S.trim[0],40);
      bolt(cx+M*0.03,cy+M*0.03,Math.max(1.2,M*0.022));
    }
    if(P.markings>0.05){
      a.fillStyle=S.mark;
      a.fillRect(x0+bw*0.16,y0+bh*0.40,bw*0.30,Math.max(1.5,bh*0.09));
      a.fillStyle=shade(S.mark,-0.35);
      for(let i=0;i<3;i++)a.fillRect(x0+bw*0.55+i*bw*0.10,y0+bh*0.40,Math.max(1,bw*0.05),Math.max(1.5,bh*0.09));
    }
  }

  else if(kind==='drum'){
    const cx=(x0+x1)/2, r=bw*0.44;
    a.fillStyle=S.body[0];
    a.fillRect(cx-r,y0,r*2,bh);
    // cylinder shading comes from the height buffer, not painted
    for(let x=0;x<W;x++){
      const t=(x-(cx-r))/(r*2);
      if(t<0||t>1)continue;
      const round=Math.sqrt(Math.max(0,1-Math.pow((t-0.5)*2,2)));
      hc.fillStyle=hg(BASE+round*66);
      hc.fillRect(x,y0,1,bh);
    }
    // rolling hoops
    for(const ty of [0.16,0.5,0.84]){
      band(cx-r*1.06,y0+bh*ty-M*0.035,r*2.12,M*0.07,S.trim[0],44);
    }
    // lid rim
    a.fillStyle=shade(S.trim[0],0.06);
    a.fillRect(cx-r*1.04,y0,r*2.08,M*0.06);
    hc.fillStyle=hg(BASE+58);hc.fillRect(cx-r*1.04,y0,r*2.08,M*0.06);
    if(P.markings>0.05){
      a.fillStyle=S.mark;
      a.beginPath();a.moveTo(cx,y0+bh*0.34);a.lineTo(cx+r*0.42,y0+bh*0.60);
      a.lineTo(cx-r*0.42,y0+bh*0.60);a.closePath();a.fill();
      a.fillStyle=S.dark;
      a.fillRect(cx-Math.max(0.8,r*0.06),y0+bh*0.42,Math.max(1.6,r*0.12),bh*0.11);
    }
  }

  else if(kind==='slab'){
    /* a broken lump of poured concrete: irregular, with rebar out of it */
    const pts=[],n=rng.int(6,9);
    for(let i=0;i<n;i++){
      const ang=(i/n)*TAU+rng.range(-0.16,0.16);
      const rad=(0.36+rng.range(0,0.16));
      pts.push([ (x0+x1)/2+Math.cos(ang)*bw*rad, (y0+y1)/2+Math.sin(ang)*bh*rad ]);
    }
    const path=c=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();};
    a.fillStyle=S.body[0];path(a);a.fill();
    hc.fillStyle=hg(BASE+30);path(hc);hc.fill();
    // aggregate: pebbles pushed through the surface
    for(let i=0;i<Math.round(22*grit);i++){
      const px=rng.range(x0,x1),py=rng.range(y0,y1);
      const rr=Math.max(1,M*rng.range(0.014,0.036));
      a.fillStyle=rng.chance(0.5)?shade(S.body[1],0.10):shade(S.body[2],-0.06);
      a.beginPath();a.arc(px,py,rr,0,TAU);a.fill();
      const g=hc.createRadialGradient(px,py,0,px,py,rr*1.5);
      g.addColorStop(0,hg(BASE+62));g.addColorStop(1,'rgba(128,128,128,0)');
      hc.fillStyle=g;hc.beginPath();hc.arc(px,py,rr*1.5,0,TAU);hc.fill();
    }
    // rebar stubs
    for(let i=0;i<rng.int(1,3);i++){
      const ang=rng.range(0,TAU);
      const sx=(x0+x1)/2+Math.cos(ang)*bw*0.30, sy=(y0+y1)/2+Math.sin(ang)*bh*0.30;
      const ex=sx+Math.cos(ang)*bw*rng.range(0.22,0.40), ey=sy+Math.sin(ang)*bh*rng.range(0.22,0.40);
      a.strokeStyle=shade(S.trim[2],0.06);a.lineWidth=Math.max(1.6,M*0.035);a.lineCap='round';
      a.beginPath();a.moveTo(sx,sy);a.lineTo(ex,ey);a.stroke();
      hc.strokeStyle=hg(BASE+52);hc.lineWidth=Math.max(1.6,M*0.035);hc.lineCap='round';
      hc.beginPath();hc.moveTo(sx,sy);hc.lineTo(ex,ey);hc.stroke();
    }
  }

  else if(kind==='girder'){
    /* I-beam offcut seen end-on-ish */
    const fw=bw*0.92, ft=bh*0.20, wt=bw*0.26;
    const cx=(x0+x1)/2;
    panel(cx-fw/2,y0,fw,ft,S.trim[0],44);                 // top flange
    panel(cx-fw/2,y1-ft,fw,ft,S.trim[0],38);              // bottom flange
    panel(cx-wt/2,y0+ft,wt,bh-ft*2,S.trim[1],20);         // web
    // lightening holes
    const nH=rng.int(1,3);
    for(let i=0;i<nH;i++){
      const hy=y0+ft+(bh-ft*2)*((i+0.5)/nH);
      a.save();a.globalCompositeOperation='destination-out';
      a.beginPath();a.arc(cx,hy,wt*0.28,0,TAU);a.fill();a.restore();
      hc.fillStyle=hg(BASE-40);
      hc.beginPath();hc.arc(cx,hy,wt*0.28,0,TAU);hc.fill();
    }
    for(let i=0;i<rng.int(2,5);i++){
      bolt(cx-fw/2+fw*rng.range(0.1,0.9),y0+ft*0.5,Math.max(1.2,M*0.022));
      bolt(cx-fw/2+fw*rng.range(0.1,0.9),y1-ft*0.5,Math.max(1.2,M*0.022));
    }
  }

  else if(kind==='bale'){
    /* compressed scrap cube, bound with wire */
    panel(x0,y0,bw,bh,S.body[2],22);
    for(let i=0;i<Math.round(30*grit);i++){
      const px=rng.range(x0,x1),py=rng.range(y0,y1);
      const w2=M*rng.range(0.05,0.20),h2=M*rng.range(0.03,0.10);
      a.fillStyle=rng.chance(0.45)?shade(S.trim[0],rng.range(-0.2,0.15))
                                  :shade(S.body[rng.int(0,1)],rng.range(-0.2,0.2));
      a.save();a.translate(px,py);a.rotate(rng.range(0,TAU));
      a.fillRect(-w2/2,-h2/2,w2,h2);
      hc.fillStyle=hg(BASE+rng.range(6,58));
      hc.fillRect(-w2/2,-h2/2,w2,h2);
      a.restore();
    }
    // binding wires
    for(const t of [0.28,0.72]){
      a.strokeStyle=shade(S.trim[2],0.18);a.lineWidth=Math.max(1.2,M*0.026);
      a.beginPath();a.moveTo(x0,y0+bh*t);a.lineTo(x1,y0+bh*t);a.stroke();
      hc.strokeStyle=hg(BASE+50);hc.lineWidth=Math.max(1.2,M*0.026);
      hc.beginPath();hc.moveTo(x0,y0+bh*t);hc.lineTo(x1,y0+bh*t);hc.stroke();
    }
  }

  else {   /* panel — a torn sheet of plate */
    const th=bh*0.72;   // thick enough to be a body, not a hairline
    const yy=(y0+y1)/2-th/2;
    a.fillStyle=S.trim[0];
    a.beginPath();
    a.moveTo(x0,yy+th*rng.range(0,0.3));
    a.lineTo(x1,yy);
    a.lineTo(x1,yy+th);
    a.lineTo(x0,yy+th*rng.range(0.75,1.1));
    a.closePath();a.fill();
    hc.fillStyle=hg(BASE+34);
    hc.beginPath();
    hc.moveTo(x0,yy+th*0.1);hc.lineTo(x1,yy);hc.lineTo(x1,yy+th);hc.lineTo(x0,yy+th);
    hc.closePath();hc.fill();
    // corrugation
    for(let x=x0;x<x1;x+=M*0.09){
      hc.fillStyle=hg(BASE+58);hc.fillRect(x,yy,Math.max(1,M*0.03),th);
    }
    for(let i=0;i<rng.int(2,5);i++)bolt(rng.range(x0+M*0.06,x1-M*0.06),yy+th*0.5,Math.max(1.2,M*0.022));
  }

  /* ---- grime: streaks and staining, before damage ---- */
  if(P.grime>0.02){
    a.save();a.globalCompositeOperation='source-atop';
    for(let i=0;i<Math.round(9*P.grime);i++){
      const px=rng.range(x0,x1);
      const g=a.createLinearGradient(0,y0,0,y1);
      g.addColorStop(0,'rgba(20,16,12,0)');
      g.addColorStop(1,'rgba(20,16,12,'+(0.16+rng.rnd()*0.26)*P.grime+')');
      a.fillStyle=g;
      a.fillRect(px,y0,M*rng.range(0.03,0.12),bh);
    }
    // pooled dirt in the lower corners
    const g2=a.createLinearGradient(0,y0+bh*0.55,0,y1);
    g2.addColorStop(0,'rgba(16,13,10,0)');
    g2.addColorStop(1,'rgba(16,13,10,'+0.34*P.grime+')');
    a.fillStyle=g2;a.fillRect(x0,y0+bh*0.55,bw,bh*0.45);
    a.restore();
  }

  /* ---- wear: bright scuffed edges where paint has gone ---- */
  if(P.wear>0.02){
    a.save();a.globalCompositeOperation='source-atop';
    for(let i=0;i<Math.round(14*P.wear);i++){
      const px=rng.range(x0,x1),py=rng.range(y0,y1);
      a.fillStyle=shade(S.trim[1],0.18);
      a.globalAlpha=rng.range(0.25,0.7);
      a.fillRect(px,py,Math.max(1,M*rng.range(0.02,0.07)),Math.max(1,M*rng.range(0.01,0.03)));
    }
    a.restore();
  }

  /* ---- damage: chip the silhouette and open the seams ---- */
  if(dmg>0.01){
    const bites=Math.round(3+dmg*9);
    a.save();a.globalCompositeOperation='destination-out';
    for(let i=0;i<bites;i++){
      const ang=rng.range(0,TAU);
      const px=(x0+x1)/2+Math.cos(ang)*bw*rng.range(0.34,0.55);
      const py=(y0+y1)/2+Math.sin(ang)*bh*rng.range(0.34,0.55);
      const r=M*rng.range(0.05,0.14)*(0.5+dmg);
      a.beginPath();
      for(let k=0;k<6;k++){
        const aa=(k/6)*TAU, rr=r*rng.range(0.6,1.35);
        const qx=px+Math.cos(aa)*rr, qy=py+Math.sin(aa)*rr;
        k?a.lineTo(qx,qy):a.moveTo(qx,qy);
      }
      a.closePath();a.fill();
    }
    a.restore();
    // cracks across the face
    a.strokeStyle=S.dark;
    for(let i=0;i<Math.round(2+dmg*5);i++){
      let cx2=rng.range(x0,x1),cy2=rng.range(y0,y1),ang=rng.range(0,TAU);
      a.lineWidth=Math.max(1,M*0.018);
      a.beginPath();a.moveTo(cx2,cy2);
      for(let k=0;k<4;k++){
        ang+=rng.range(-0.8,0.8);
        cx2+=Math.cos(ang)*M*0.12;cy2+=Math.sin(ang)*M*0.12;
        a.lineTo(cx2,cy2);
      }
      a.stroke();
    }
  }

  /* ---- clip the height and glow buffers to whatever ink survived ---- */
  for(const buf of [Hc,E]){
    const c=buf.getContext('2d');
    c.globalCompositeOperation='destination-in';
    c.drawImage(A,0,0);
    c.globalCompositeOperation='source-over';
  }
}

/* ================================================================
   PHYSICS BAKE

   Measured off the finished pixels, same as CRAWLER FORGE. A rigid
   body built from these numbers collides as the thing looks, and a
   crate that has been shot to pieces gets a smaller box for free
   because its silhouette actually shrank.
   ================================================================ */
function bakeBody(ctx,cx,cy,CW,CH,kind){
  const img=ctx.getImageData(cx,cy,CW,CH).data;
  const solid=(x,y)=>x>=0&&y>=0&&x<CW&&y<CH&&img[((y|0)*CW+(x|0))*4+3]>8;
  let x0=CW,y0=CH,x1=-1,y1=-1,n=0,sx=0,sy=0;
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){
    if(!solid(x,y))continue;
    n++;sx+=x;sy+=y;
    if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
  }
  if(n===0){x0=y0=0;x1=CW-1;y1=CH-1;n=1;sx=CW/2;sy=CH/2;}
  const gx=sx/n,gy=sy/n;
  /* Offsets are relative to the CELL centre, not the ink bbox centre:
     the game blits the sprite centred on the body position, so a hull
     measured against the bbox would sit off the sprite whenever the
     piece is not centred in its cell. */
  const cxm=CW/2,cym=CH/2;

  const RAYS=16,hull=[];
  for(let i=0;i<RAYS;i++){
    const a=(i/RAYS)*TAU,ca=Math.cos(a),sa=Math.sin(a);
    let last=0;
    for(let d=0;d<Math.max(CW,CH);d+=0.5)if(solid(gx+ca*d,gy+sa*d))last=d;
    hull.push({x:+(gx+ca*last-cxm).toFixed(2),y:+(gy+sa*last-cym).toFixed(2)});
  }

  /* Half extents come from the ink, not the cell: a cell is padded for
     the outline dilate and using it would inflate every box.

     They are then pulled in a little further on purpose. A box that
     matches the silhouette exactly leaves a piece perched on the deck
     with a hairline of daylight under it — the outline dilate is part
     of that silhouette, and real debris beds into the ground it lands
     on. Sinking the box is what makes a crate look like it is sitting
     in the dirt rather than hovering over it. */
  const INSET_X=0.90, INSET_Y=0.82;
  const hw=(x1-x0+1)/2*INSET_X, hh=(y1-y0+1)/2*INSET_Y;
  const fill=n/Math.max(1,(x1-x0+1)*(y1-y0+1));

  /* Material feel per kind, scaled by how much of the box is solid. */
  const MAT={
    crate:  {density:0.75,bounce:0.16,fric:0.72,hp:16},
    drum:   {density:0.90,bounce:0.30,fric:0.42,hp:14},
    slab:   {density:1.55,bounce:0.06,fric:0.88,hp:34},
    girder: {density:1.70,bounce:0.10,fric:0.66,hp:44},
    bale:   {density:1.05,bounce:0.08,fric:0.90,hp:22},
    panel:  {density:0.55,bounce:0.22,fric:0.50,hp:10}
  }[kind]||{density:1,bounce:0.2,fric:0.7,hp:20};

  const rng=makeRng((P.seed^0x5c4a)>>>0);
  const gibs=[];
  for(let t=0;t<160&&gibs.length<12;t++){
    /* Floor before testing AND before storing: solid() indexes by
       floor, so storing the raw float lets a consumer that rounds land
       on a neighbouring pixel that is empty. */
    const px=Math.floor(rng.range(x0,x1+1)),py=Math.floor(rng.range(y0,y1+1));
    if(solid(px,py))gibs.push({x:+(px-cxm).toFixed(2),y:+(py-cym).toFixed(2)});
  }

  return{
    hull, gibs,
    halfW:+hw.toFixed(2), halfH:+hh.toFixed(2),
    centre:{x:+(gx-cxm).toFixed(2),y:+(gy-cym).toFixed(2)},
    fill:+fill.toFixed(3),
    mass:+(MAT.density*(hw/INSET_X)*(hh/INSET_Y)*fill*0.02).toFixed(3),
    bounce:MAT.bounce, friction:MAT.fric,
    hp:Math.round(MAT.hp*(0.6+fill*0.7)),
    kind
  };
}

/* ================================================================
   SHEET BUILD — columns are damage states
   ================================================================ */
let SHEET=null;
function forgeOne(kind,params){
  const t0=(typeof performance!=='undefined'?performance.now():Date.now());
  const saved=Object.assign({},P);
  Object.assign(P,params||{});
  if(kind)P.kind=kind;
  buildNoise(P.seed>>>0);
  const pal=buildPalette();
  const SS=clamp(P.SS|0,2,Math.max(2,Math.floor(200/Math.max(6,P.size))));
  const frames=clamp(P.dmgFrames|0,1,4);

  /* aspect per kind, so a girder is not square */
  const AR={crate:1.0,drum:1.22,slab:0.88,girder:1.45,bale:1.0,panel:0.62}[P.kind]||1;
  const cellW=Math.max(6,Math.round(P.size));
  const cellH=Math.max(6,Math.round(P.size*AR));
  const pad=P.outline?2:1;
  const CW=cellW+pad*2, CH=cellH+pad*2;
  const L=Math.max(cellW,cellH)*SS;
  const LW=cellW*SS, LH=cellH*SS;

  const sheet=mkCanvas(CW*frames,CH);
  const sctx=sheet.getContext('2d',{willReadFrequently:true});
  for(let f=0;f<frames;f++){
    const dmg=frames<2?0:(f/(frames-1))*0.92;
    const rng=makeRng((P.seed^0x77+f*0x9e37)>>>0);
    const A=mkCanvas(LW,LH),Hc=mkCanvas(LW,LH),E=mkCanvas(LW,LH);
    const hcx=Hc.getContext('2d');
    hcx.fillStyle='rgb(128,128,128)';hcx.fillRect(0,0,LW,LH);
    drawPiece(P.kind,dmg,A,Hc,E,LW,LH,rng,pal,clamp(P.grit,0,1.5));
    const hd=hcx.getImageData(0,0,LW,LH).data;
    const Hf=new Float32Array(LW*LH);
    for(let i=0;i<LW*LH;i++)Hf[i]=hd[i*4];
    lightPass(A,Hf,E,LW,LH);
    sctx.drawImage(crush(A,cellW,cellH),f*CW+pad,pad);
  }
  rasterise(sctx,sheet.width,sheet.height,pal,CW,CH);

  const bodies=[];
  for(let f=0;f<frames;f++)bodies.push(bakeBody(sctx,f*CW,0,CW,CH,P.kind));

  const ms=Math.round((typeof performance!=='undefined'?performance.now():Date.now())-t0);
  const out={canvas:sheet,CW,CH,frames,kind:P.kind,palette:P.palette,
             seed:P.seed>>>0,size:P.size,bodies,body:bodies[0],ms,
             anchor:{x:CW/2,y:CH/2}};
  Object.assign(P,saved);
  return out;
}
function buildSheet(){SHEET=forgeOne(P.kind,null);return SHEET;}

/* Every kind at once — what the game actually asks for. */
function forgeSet(seed,opts){
  const o=opts||{};
  const kinds=o.kinds||KINDS;
  const out={};
  kinds.forEach((k,i)=>{
    out[k]=forgeOne(k,Object.assign({},o.params,{seed:(seed+i*0x9e3779b9)>>>0}));
  });
  return out;
}

/* ================================================================
   UI
   ================================================================ */
const $=id=>document.getElementById(id);
let MODE='all';
function buildUI(){
  const rail=$('rail');rail.innerHTML='';
  CONTROLS.forEach(g=>{
    const box=document.createElement('div');box.className='grp';
    box.innerHTML='<div class="grp-h"><b>'+g.g+'</b></div>';
    const body=document.createElement('div');body.className='grp-b';
    g.c.forEach(c=>body.appendChild(makeControl(c)));
    box.appendChild(body);rail.appendChild(box);
  });
}
function makeControl(c){
  const row=document.createElement('div');row.className='ctl';
  if(c.t==='buttons'){
    const wrap=document.createElement('div');wrap.style.width='100%';
    const r=document.createElement('div');r.className='row';
    const b1=document.createElement('button');b1.className='primary';b1.textContent='RESEED';
    b1.onclick=()=>{P.seed=(Math.random()*0xffffffff)>>>0;regen();};
    const b2=document.createElement('button');b2.textContent='PNG';
    b2.onclick=()=>{if(!SHEET)return;const a=document.createElement('a');
      a.href=SHEET.canvas.toDataURL('image/png');
      a.download='scrap_'+SHEET.kind+'_'+SHEET.seed.toString(16)+'.png';a.click();};
    r.appendChild(b1);r.appendChild(b2);wrap.appendChild(r);row.appendChild(wrap);
    return row;
  }
  const lab=document.createElement('label');lab.textContent=c.l;row.appendChild(lab);
  if(c.t==='s'){
    const sel=document.createElement('select');
    (typeof c.opt==='function'?c.opt():c.opt).forEach(o=>{
      const op=document.createElement('option');op.value=o;
      op.textContent=(PALETTES[o]&&PALETTES[o].label)||o;sel.appendChild(op);});
    sel.value=String(P[c.k]);
    sel.onchange=()=>{P[c.k]=sel.value;regen();};
    row.appendChild(sel);
  }else if(c.t==='c'){
    const w=document.createElement('div');w.className='chk';
    const b=document.createElement('input');b.type='checkbox';b.checked=!!P[c.k];
    b.onchange=()=>{P[c.k]=b.checked;regen();};
    w.appendChild(b);row.appendChild(w);
  }else{
    const inp=document.createElement('input');inp.type='range';
    inp.min=c.min;inp.max=c.max;inp.step=c.step;inp.value=P[c.k];
    const out=document.createElement('span');out.className='val';
    const show=v=>out.textContent=c.fmt?c.fmt(v):(c.step<1?(+v).toFixed(2):v);
    show(P[c.k]);
    inp.oninput=()=>{P[c.k]=+inp.value;show(P[c.k]);regen();};
    row.appendChild(inp);row.appendChild(out);
  }
  return row;
}

let timer=0;
function regen(){
  clearTimeout(timer);
  timer=setTimeout(()=>{
    try{buildSheet();}catch(e){console.error(e);return;}
    $('f_cell').textContent=SHEET.CW+'×'+SHEET.CH+' ×'+SHEET.frames;
    $('f_mass').textContent=SHEET.body.mass;
    $('f_hull').textContent=SHEET.body.hull.length+' pts · '+SHEET.body.halfW+'×'+SHEET.body.halfH;
    $('f_ms').textContent=SHEET.ms+'ms';
    draw();
  },90);
}
function draw(){
  if(!SHEET)return;
  const Z=Math.max(2,Math.min(8,Math.floor(420/Math.max(SHEET.CW*SHEET.frames,SHEET.CH))));
  {
    const cv=$('one');cv.width=SHEET.canvas.width*Z;cv.height=SHEET.canvas.height*Z;
    const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
    c.drawImage(SHEET.canvas,0,0,cv.width,cv.height);
  }
  {   // every kind, in the current palette
    const set=forgeSet(P.seed,{params:{palette:P.palette,size:P.size}});
    const zz=5, gap=8;
    let tw=0,th=0;
    for(const k of KINDS){tw+=set[k].canvas.width*zz+gap;th=Math.max(th,set[k].canvas.height*zz);}
    const cv=$('all');cv.width=tw+gap;cv.height=th+34;
    const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
    c.fillStyle='#14181a';c.fillRect(0,0,cv.width,cv.height);
    c.font='11px monospace';
    let x=gap;
    for(const k of KINDS){
      const S=set[k];
      c.drawImage(S.canvas,x,8,S.canvas.width*zz,S.canvas.height*zz);
      c.fillStyle='#8d9aa2';c.fillText(k+'  m'+S.body.mass,x,th+24);
      x+=S.canvas.width*zz+gap;
    }
  }
  {   // physics overlay on the intact frame
    const s=10,B=SHEET.body;
    const cv=$('phys');cv.width=SHEET.CW*s;cv.height=SHEET.CH*s;
    const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
    c.fillStyle='#0e1113';c.fillRect(0,0,cv.width,cv.height);
    c.drawImage(SHEET.canvas,0,0,SHEET.CW,SHEET.CH,0,0,cv.width,cv.height);
    const X=v=>(SHEET.CW/2+v)*s, Y=v=>(SHEET.CH/2+v)*s;
    c.strokeStyle='rgba(240,168,48,.9)';c.lineWidth=2;
    c.beginPath();B.hull.forEach((h,i)=>i?c.lineTo(X(h.x),Y(h.y)):c.moveTo(X(h.x),Y(h.y)));
    c.closePath();c.stroke();
    c.strokeStyle='#4ad07a';c.lineWidth=2;
    c.strokeRect(X(-B.halfW),Y(-B.halfH),B.halfW*2*s,B.halfH*2*s);
    c.fillStyle='#ff5f7a';c.beginPath();c.arc(X(B.centre.x),Y(B.centre.y),4,0,TAU);c.fill();
    c.fillStyle='rgba(255,255,255,.6)';
    for(const g of B.gibs)c.fillRect(X(g.x)-2,Y(g.y)-2,4,4);
  }
}
function setMode(m){
  MODE=m;
  for(const k of ['all','one','phys']){
    $(k).classList.toggle('hide',k!==m);
    $('mb-'+k).classList.toggle('on',k===m);
  }
}
$('mb-all').onclick=()=>setMode('all');
$('mb-one').onclick=()=>setMode('one');
$('mb-phys').onclick=()=>setMode('phys');
buildUI();regen();
</script>
</body>
