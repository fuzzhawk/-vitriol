<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MERC FORGE — run &amp; gun sprite generator</title>
<style>
:root{
  --bg:#14120f;
  --panel:#1c1a16;
  --panel2:#232019;
  --line:#3a342a;
  --ink:#d8cfbd;
  --dim:#8c8271;
  --rust:#c2571f;
  --amber:#f0a830;
  --olive:#7f8f45;
  --steel:#5d6b73;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  overflow:hidden;
}
kbd{font:11px ui-monospace,monospace;background:#2c281f;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--amber)}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:312px 1fr;height:100vh}
header{
  grid-column:1/-1;display:flex;align-items:baseline;gap:14px;
  padding:9px 16px;background:linear-gradient(180deg,#241f18,#191612);
  border-bottom:1px solid var(--line)
}
header h1{
  margin:0;font:700 17px/1 ui-monospace,monospace;letter-spacing:.22em;
  color:var(--amber);text-shadow:0 0 14px rgba(240,168,48,.28)
}
header h1 b{color:var(--rust);font-weight:700}
header .tag{font:11px ui-monospace,monospace;color:var(--dim);letter-spacing:.08em}
header .spacer{flex:1}
header .keys{font:11px ui-monospace,monospace;color:var(--dim)}

/* ---------- control rail ---------- */
#rail{
  background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;overscroll-behavior:contain;padding-bottom:40px
}
#rail::-webkit-scrollbar{width:9px}
#rail::-webkit-scrollbar-thumb{background:#3a342a;border-radius:0}
.grp{border-bottom:1px solid var(--line)}
.grp>summary{
  cursor:pointer;list-style:none;padding:8px 12px;
  font:600 11px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--olive);
  background:var(--panel2);display:flex;justify-content:space-between;align-items:center
}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"+";color:var(--dim)}
.grp[open]>summary::after{content:"–"}
.grp>div{padding:8px 12px 12px}
.ctl{margin-bottom:9px}
.ctl label{display:flex;justify-content:space-between;font:11px ui-monospace,monospace;color:var(--dim);margin-bottom:3px}
.ctl label span{color:var(--ink)}
.ctl input[type=range]{width:100%;height:16px;-webkit-appearance:none;background:transparent;margin:0}
.ctl input[type=range]::-webkit-slider-runnable-track{height:3px;background:#3a342a}
.ctl input[type=range]::-moz-range-track{height:3px;background:#3a342a}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:14px;margin-top:-6px;background:var(--amber);border:0;border-radius:1px;cursor:ew-resize}
.ctl input[type=range]::-moz-range-thumb{width:11px;height:14px;background:var(--amber);border:0;border-radius:1px;cursor:ew-resize}
.ctl select{width:100%;background:#12100d;color:var(--ink);border:1px solid var(--line);padding:4px 6px;font:11px ui-monospace,monospace;border-radius:2px}
.ctl.chk label{cursor:pointer;color:var(--ink)}
.ctl input[type=checkbox]{accent-color:var(--rust);width:14px;height:14px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sw{display:flex;flex-direction:column;gap:3px}
.sw span{font:10px ui-monospace,monospace;color:var(--dim)}
.sw input{width:100%;height:26px;padding:0;border:1px solid var(--line);background:#12100d;cursor:pointer}
.row{display:flex;gap:6px}
button{
  flex:1;background:#2b261e;color:var(--ink);border:1px solid var(--line);
  padding:6px 8px;font:11px ui-monospace,monospace;letter-spacing:.08em;cursor:pointer;border-radius:2px
}
button:hover{background:#3a3226;border-color:var(--rust);color:#fff}
button:active{transform:translateY(1px)}
button.hot{background:var(--rust);border-color:#e0762f;color:#fff}
button.on{background:var(--olive);border-color:#9cae57;color:#12100d}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

/* ---------- stage ---------- */
#stage{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
#top{display:grid;grid-template-columns:270px 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.pane{background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:0}
.pane h2{
  margin:0;padding:6px 10px;font:600 10px/1 ui-monospace,monospace;letter-spacing:.18em;
  color:var(--dim);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center
}
.pane h2 em{font-style:normal;color:var(--amber);margin-left:auto}
.pane .body{padding:8px 10px;min-height:0;overflow:auto}
#previewWrap{display:flex;gap:10px;align-items:flex-start}
#preview{image-rendering:pixelated;background:
  repeating-conic-gradient(#1b1815 0 25%,#211d18 0 50%) 0 0/12px 12px;
  border:1px solid var(--line)}
#statebar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
#statebar button{flex:0 0 auto;padding:3px 7px}
#sheetScroll{overflow:auto;max-height:186px;border:1px solid var(--line);background:#0e0c0a}
#sheet{image-rendering:pixelated;display:block}
#demoPane{position:relative;background:#0b0a08;min-height:0;overflow:hidden}
#demo{image-rendering:pixelated;display:block;width:100%;height:100%;object-fit:contain;cursor:crosshair}
#demoHud{
  position:absolute;left:10px;bottom:8px;font:11px ui-monospace,monospace;
  color:var(--dim);text-shadow:0 1px 0 #000;pointer-events:none
}
#demoHud b{color:var(--amber);font-weight:400}
#tip{position:absolute;right:10px;top:8px;font:11px ui-monospace,monospace;color:var(--dim);text-shadow:0 1px 0 #000;pointer-events:none;text-align:right}
@media (max-width:900px){
  body{overflow:auto}
  #shell{grid-template-columns:1fr;height:auto}
  #rail{max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  #top{grid-template-columns:1fr}
  #demoPane{height:56vw}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="shell">
  <header>
    <h1>MERC<b>·</b>FORGE</h1>
    <span class="tag">run &amp; gun sprite rig</span>
    <span class="spacer"></span>
    <span class="keys"><kbd>A</kbd><kbd>D</kbd> move &nbsp;<kbd>W</kbd> jump &nbsp;<kbd>S</kbd> crouch &nbsp;mouse aim &nbsp;click fire</span>
  </header>

  <aside id="rail"></aside>

  <main id="stage">
    <div id="top">
      <section class="pane">
        <h2>Preview <em id="cellInfo"></em></h2>
        <div class="body">
          <div id="statebar"></div>
          <div id="previewWrap">
            <canvas id="preview" width="200" height="200"></canvas>
          </div>
          <div class="ctl" style="margin-top:8px">
            <label>aim row <span id="aimLbl">0°</span></label>
            <input id="aimSlider" type="range" min="0" max="8" step="1" value="4">
          </div>
        </div>
      </section>
      <section class="pane">
        <h2>Sheet <em id="sheetInfo"></em></h2>
        <div class="body" style="padding-top:6px">
          <div id="sheetScroll"><canvas id="sheet"></canvas></div>
          <div class="row" style="margin-top:8px">
            <button id="btnPng">Download PNG</button>
            <button id="btnJson">Download JSON</button>
            <button id="btnZoom">Sheet zoom ×1</button>
          </div>
        </div>
      </section>
    </div>
    <div id="demoPane">
      <canvas id="demo" width="960" height="540"></canvas>
      <div id="tip">every frame here is blitted from the sheet above &mdash; nothing is drawn live<br><kbd>R</kbd> resets</div>
      <div id="demoHud"></div>
    </div>
  </main>
</div>

<script>
"use strict";
/* ============================================================
   MERC FORGE — procedural spritesheet generator
   Single file, vanilla Canvas 2D, no dependencies.
   Rig -> pose -> raster -> palette snap -> shade -> outline -> sheet
   ============================================================ */

/* ---------- tiny utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
function rng(seed){let a=seed>>>0;return function(){a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};}
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rh(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function shade(h,a){const c=hx(h);if(a>=0)return rh(c[0]+(255-c[0])*a,c[1]+(255-c[1])*a,c[2]+(255-c[2])*a);return rh(c[0]*(1+a),c[1]*(1+a),c[2]*(1+a));}
function hsl(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return rh(f(0)*255,f(8)*255,f(4)*255);}

/* ---------- parameters ---------- */
const P={
  seed:4771,
  // frame
  height:30, headSize:1.0, torsoLen:0.30, legLen:0.46, armLen:0.40,
  shoulderW:0.32, hipW:0.22, limbThick:0.072, bootSize:1.0, gloveSize:1.0,
  // gear
  helmet:'visor', antenna:false, pads:0.55, backpack:'tank', plates:true,
  gun:'rifle', gunSize:1.0, twoHanded:true, muzzleBrake:true,
  // colour
  colSuit:'#4c6076', colSuit2:'#2b3646', colAccent:'#c2571f',
  colSkin:'#d9a173', colVisor:'#f0a830', colGun:'#7d8794', colOutline:'#0d0b09',
  rim:0.30, shadow:0.32,
  // motion
  runFrames:8, stride:0.30, lift:0.15, bounce:0.028, lean:4, runLean:7,
  idleBob:0.014, tuck:0.42, recoil:0.35,
  // render
  outline:true, shading:true, aimRows:9, previewFps:12
};

const CONTROLS=[
 {g:'FRAME',c:[
  {k:'height',l:'height',t:'r',min:18,max:46,step:1,fmt:v=>v+'px'},
  {k:'headSize',l:'head',t:'r',min:0.55,max:1.7,step:0.01},
  {k:'torsoLen',l:'torso length',t:'r',min:0.18,max:0.42,step:0.005},
  {k:'legLen',l:'leg length',t:'r',min:0.30,max:0.60,step:0.005},
  {k:'armLen',l:'arm length',t:'r',min:0.26,max:0.56,step:0.005},
  {k:'shoulderW',l:'shoulders',t:'r',min:0.16,max:0.50,step:0.005},
  {k:'hipW',l:'hips',t:'r',min:0.12,max:0.36,step:0.005},
  {k:'limbThick',l:'limb weight',t:'r',min:0.035,max:0.14,step:0.002},
  {k:'bootSize',l:'boots',t:'r',min:0,max:2,step:0.05},
  {k:'gloveSize',l:'gloves',t:'r',min:0,max:2,step:0.05}
 ]},
 {g:'GEAR',c:[
  {k:'helmet',l:'head gear',t:'s',opt:['none','visor','full','crest']},
  {k:'backpack',l:'back unit',t:'s',opt:['none','tank','jet','pack']},
  {k:'pads',l:'shoulder pads',t:'r',min:0,max:1.4,step:0.05},
  {k:'plates',l:'chest plate',t:'c'},
  {k:'antenna',l:'antenna',t:'c'}
 ]},
 {g:'WEAPON',c:[
  {k:'gun',l:'weapon',t:'s',opt:['pistol','smg','rifle','cannon','beam']},
  {k:'gunSize',l:'weapon scale',t:'r',min:0.6,max:1.7,step:0.05},
  {k:'twoHanded',l:'two-handed grip',t:'c'},
  {k:'muzzleBrake',l:'muzzle brake',t:'c'},
  {k:'recoil',l:'recoil kick',t:'r',min:0,max:1,step:0.05}
 ]},
 {g:'PALETTE',c:[
  {k:'__colors',t:'colors'},
  {k:'rim',l:'rim light',t:'r',min:0,max:0.6,step:0.02},
  {k:'shadow',l:'contact shadow',t:'r',min:0,max:0.6,step:0.02},
  {k:'outline',l:'outline',t:'c'},
  {k:'shading',l:'edge shading',t:'c'}
 ]},
 {g:'MOTION',c:[
  {k:'runFrames',l:'run frames',t:'s',opt:['6','8','10','12'],num:true},
  {k:'stride',l:'stride',t:'r',min:0.10,max:0.55,step:0.01},
  {k:'lift',l:'foot lift',t:'r',min:0.02,max:0.30,step:0.01},
  {k:'bounce',l:'hip bounce',t:'r',min:0,max:0.09,step:0.002},
  {k:'runLean',l:'run lean',t:'r',min:-10,max:26,step:1,fmt:v=>v+'°'},
  {k:'lean',l:'base lean',t:'r',min:-8,max:18,step:1,fmt:v=>v+'°'},
  {k:'tuck',l:'jump tuck',t:'r',min:0,max:0.8,step:0.02},
  {k:'idleBob',l:'idle breath',t:'r',min:0,max:0.05,step:0.002}
 ]},
 {g:'SHEET',c:[
  {k:'aimRows',l:'aim directions',t:'s',opt:['5','9','13','17'],num:true},
  {k:'previewFps',l:'preview fps',t:'r',min:2,max:24,step:1},
  {k:'__buttons',t:'buttons'}
 ]}
];

const PRESETS={
  nick:{height:30,headSize:1.0,helmet:'visor',backpack:'tank',gun:'rifle',twoHanded:true,
        colSuit:'#4c6076',colSuit2:'#2b3646',colAccent:'#c2571f',colVisor:'#f0a830',colGun:'#7d8794',pads:0.55,plates:true},
  trooper:{height:34,headSize:0.92,helmet:'full',backpack:'pack',gun:'smg',twoHanded:true,limbThick:0.088,
        colSuit:'#6d6f5e',colSuit2:'#3a3b31',colAccent:'#b8402a',colVisor:'#8fe3c2',colGun:'#5c6068',pads:1.0,plates:true,antenna:true},
  scav:{height:27,headSize:1.15,helmet:'none',backpack:'tank',gun:'pistol',twoHanded:false,limbThick:0.058,
        colSuit:'#7a5a3a',colSuit2:'#402d1e',colAccent:'#d9c07a',colVisor:'#e8d9a0',colGun:'#6b6156',pads:0.2,plates:false},
  mech:{height:42,headSize:0.8,helmet:'crest',backpack:'jet',gun:'cannon',twoHanded:true,limbThick:0.12,
        colSuit:'#5a5f66',colSuit2:'#2f3338',colAccent:'#e05a1e',colVisor:'#ff6b3d',colGun:'#464b52',pads:1.3,plates:true,shoulderW:0.42}
};

/* ---------- palette ---------- */
function buildPalette(){
  const fams=[P.colSuit,P.colSuit2,P.colAccent,P.colSkin,P.colVisor,P.colGun];
  const list=[],light=[],dark=[];
  const push=hex=>{const c=hx(hex);list.push({r:c[0],g:c[1],b:c[2]});return list.length-1;};
  for(const f of fams){
    const b=push(f),l=push(shade(f,P.rim)),d=push(shade(f,-P.shadow));
    light[b]=l;dark[b]=d; light[l]=l;dark[l]=d; light[d]=l;dark[d]=d;
  }
  const matchCount=list.length;             // outline excluded from colour matching
  const o=push(P.colOutline); light[o]=o;dark[o]=o;
  return {list,light,dark,outline:o,matchCount,cache:new Map()};
}
function nearest(pal,r,g,b){
  let best=0,bd=1e9;
  for(let i=0;i<pal.matchCount;i++){
    const c=pal.list[i],dr=c.r-r,dg=c.g-g,db=c.b-b;
    const d=dr*dr*0.35+dg*dg*0.5+db*db*0.15;
    if(d<bd){bd=d;best=i;}
  }
  return best;
}

/* ---------- 2-bone IK ---------- */
function ik(ax,ay,bx,by,l1,l2,flip){
  let dx=bx-ax,dy=by-ay;
  let d=Math.hypot(dx,dy)||0.0001;
  const ux=dx/d,uy=dy/d;
  d=clamp(d,Math.abs(l1-l2)+0.001,l1+l2-0.001);
  const a=(l1*l1-l2*l2+d*d)/(2*d);
  const h=Math.sqrt(Math.max(0,l1*l1-a*a));
  return {x:ax+ux*a+flip*(-uy)*h, y:ay+uy*a+flip*(ux)*h};
}

/* ---------- animation table ---------- */
function states(){
  return [
    {id:'idle',   frames:4,             fps:6,  loop:true},
    {id:'run',    frames:P.runFrames,   fps:14, loop:true},
    {id:'jump',   frames:2,             fps:9,  loop:false},
    {id:'fall',   frames:2,             fps:9,  loop:true},
    {id:'land',   frames:1,             fps:8,  loop:false},
    {id:'crouch', frames:2,             fps:5,  loop:true}
  ];
}

/* ---------- pose solver ---------- */
function pose(state,f,nf,aim){
  const H=P.height;
  const leg=H*P.legLen, torso=H*P.torsoLen, arm=H*P.armLen;
  const hipW=H*P.hipW, shW=H*P.shoulderW, headR=H*0.115*P.headSize;
  const ph=nf>1?f/nf:0;
  let hipX=0,hipY=-leg*0.95,lean=P.lean*Math.PI/180;
  let fF={x:hipW*0.4,y:0},fB={x:-hipW*0.4,y:0};

  if(state==='idle'){
    hipY+=Math.sin(ph*TAU)*H*P.idleBob;
    fF={x:hipW*0.55,y:0};fB={x:-hipW*0.6,y:0};
  }else if(state==='run'){
    const th=ph*TAU,stride=H*P.stride,lift=H*P.lift;
    const foot=t=>{const s=Math.sin(t);return {x:Math.cos(t)*stride,y:s>0?-s*lift:0};};
    fF=foot(th);fB=foot(th+Math.PI);
    hipY+=Math.cos(2*th)*H*P.bounce;
    hipX+=H*0.02*Math.sin(th);
    lean+=P.runLean*Math.PI/180;
  }else if(state==='jump'){
    const k=f===0?1:0.72;
    hipY=-leg*0.88;
    fF={x:hipW*0.5+H*0.04,y:-leg*P.tuck*k};
    fB={x:-hipW*0.55-H*0.05,y:-leg*P.tuck*0.5*k};
    lean+=7*Math.PI/180;
  }else if(state==='fall'){
    const k=f===0?1:0.78;
    hipY=-leg*0.92;
    fF={x:hipW*0.8+H*0.05,y:-leg*0.28*k};
    fB={x:-hipW*0.85-H*0.06,y:-leg*0.10*k};
    lean-=4*Math.PI/180;
  }else if(state==='land'){
    hipY=-leg*0.62;fF={x:hipW*1.0,y:0};fB={x:-hipW*1.05,y:0};lean+=11*Math.PI/180;
  }else if(state==='crouch'){
    hipY=-leg*0.52+(f===1?H*0.012:0);
    fF={x:hipW*1.05,y:0};fB={x:-hipW*1.05,y:0};lean+=15*Math.PI/180;
  }
  lean+=aim*0.12;                        // counterweight: lean back to aim up
  const sh={x:hipX+Math.sin(lean)*torso, y:hipY-Math.cos(lean)*torso};
  const neck=headR*0.5;
  const steep=Math.abs(Math.sin(aim));
  const hd={x:sh.x+Math.sin(lean)*neck+Math.cos(aim)*headR*0.16-steep*headR*0.45,
            y:sh.y-Math.cos(lean)*neck-headR*0.88+Math.sin(aim)*headR*0.30-steep*headR*0.12};
  return {hipX,hipY,sh,hd,headR,fF,fB,lean,aim,leg,arm,torso,hipW,shW,H};
}

/* ---------- weapon table ---------- */
function gunSpec(){
  const u=P.height*0.030*P.gunSize;
  const t={
    pistol:{len:6,h:1.5,grip:2.6,mag:false,scope:false,drum:false},
    smg:   {len:9,h:1.8,grip:3.0,mag:true, scope:false,drum:false},
    rifle: {len:13,h:1.6,grip:3.0,mag:true, scope:true, drum:false},
    cannon:{len:11,h:3.0,grip:3.2,mag:false,scope:false,drum:true},
    beam:  {len:12,h:2.2,grip:3.0,mag:false,scope:false,drum:true}
  }[P.gun];
  return {u,len:t.len*u,h:t.h*u,grip:t.grip*u,mag:t.mag,scope:t.scope,drum:t.drum};
}

/* ---------- character renderer (local space: feet at 0, up = -y, faces +x) ---------- */
function drawChar(g,ps,C,opts){
  const H=P.height, gs=gunSpec();
  const legR=H*P.limbThick, armR=legR*0.84;
  const back=c=>shade(c,-0.26);
  const limb=(a,b,r,col)=>{g.strokeStyle=col;g.lineWidth=r*2;g.lineCap='round';g.lineJoin='round';
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();};
  const dot=(p,r,col)=>{g.fillStyle=col;g.beginPath();g.arc(p.x,p.y,r,0,TAU);g.fill();};

  const aim=ps.aim, dir={x:Math.cos(aim),y:Math.sin(aim)};
  const kick=(opts&&opts.kick||0)*P.recoil*H*0.06;
  const shF={x:ps.sh.x+H*0.02,y:ps.sh.y+H*0.01};
  const shB={x:ps.sh.x-H*0.035,y:ps.sh.y+H*0.015};

  /* --- back unit --- */
  if(P.backpack!=='none'){
    g.save();g.translate(ps.hipX,ps.hipY);g.rotate(ps.lean);
    const w=H*0.10,h=ps.torso*0.62,bx=-ps.shW*0.42-w;
    g.fillStyle=back(P.colSuit2);
    if(P.backpack==='tank'){
      g.beginPath();g.arc(bx,-ps.torso*0.72,w*0.62,0,TAU);g.fill();
      g.beginPath();g.arc(bx,-ps.torso*0.40,w*0.62,0,TAU);g.fill();
      g.fillStyle=shade(P.colAccent,-0.2);
      g.fillRect(bx-w*0.2,-ps.torso*0.80,w*0.4,H*0.02);
    }else if(P.backpack==='jet'){
      g.fillRect(bx-w*0.2,-ps.torso*0.86,w*1.1,h);
      g.fillStyle=shade(P.colAccent,-0.1);
      g.fillRect(bx-w*0.2,-ps.torso*0.86+h,w*1.1,H*0.035);
    }else{
      g.beginPath();g.roundRect?g.roundRect(bx,-ps.torso*0.80,w,h,w*0.35):g.rect(bx,-ps.torso*0.80,w,h);g.fill();
    }
    g.restore();
  }

  /* --- back leg --- */
  {
    const hip={x:ps.hipX-ps.hipW*0.30,y:ps.hipY};
    const knee=ik(hip.x,hip.y,ps.fB.x,ps.fB.y,ps.leg*0.5,ps.leg*0.5,-1);
    limb(hip,knee,legR*0.94,back(P.colSuit));
    limb(knee,ps.fB,legR*0.80,back(P.colSuit));
    if(P.bootSize>0){
      g.fillStyle=back(P.colSuit2);
      g.beginPath();g.ellipse(ps.fB.x+legR*0.25,ps.fB.y-legR*0.25,legR*(0.9+0.5*P.bootSize),legR*(0.7+0.3*P.bootSize),0,0,TAU);g.fill();
    }
  }

  /* --- torso --- */
  g.save();g.translate(ps.hipX,ps.hipY);g.rotate(ps.lean);
  const sw=ps.shW*0.5,hw=ps.hipW*0.55,T=ps.torso;
  g.fillStyle=P.colSuit;
  g.beginPath();
  g.moveTo(-hw,0);g.lineTo(-sw,-T*0.86);
  g.quadraticCurveTo(-sw,-T*1.06,-sw*0.55,-T*1.02);
  g.lineTo(sw*0.55,-T*1.02);
  g.quadraticCurveTo(sw,-T*1.06,sw,-T*0.86);
  g.lineTo(hw,0);g.closePath();g.fill();
  if(P.plates){
    g.fillStyle=P.colAccent;
    g.fillRect(-sw*0.52,-T*0.92,sw*1.04,T*0.30);
    g.fillStyle=shade(P.colSuit2,0.05);
    g.fillRect(-hw*0.95,-T*0.30,hw*1.9,T*0.16);
  }else{
    g.fillStyle=shade(P.colSuit2,0.05);
    g.fillRect(-hw*0.95,-T*0.26,hw*1.9,T*0.14);
  }
  if(P.pads>0){
    const pr=H*0.055*P.pads;
    g.fillStyle=P.colSuit2;
    g.beginPath();g.arc(sw*0.9,-T*0.86,pr,0,TAU);g.fill();
    g.fillStyle=back(P.colSuit2);
    g.beginPath();g.arc(-sw*0.9,-T*0.86,pr*0.9,0,TAU);g.fill();
  }
  g.fillStyle=P.colSuit2;                 // pelvis
  g.beginPath();g.ellipse(0,0,hw*1.05,H*0.045,0,0,TAU);g.fill();
  g.restore();

  /* --- rear arm + grip --- */
  const gripD=ps.arm*(P.twoHanded?0.58:0.90)-kick;
  const out=Math.abs(Math.sin(aim))*ps.arm*0.32;   // hold it clear of the body at steep angles
  let rear,front;
  if(P.twoHanded){
    rear={x:shB.x+dir.x*gripD+out*0.75,y:shB.y+dir.y*gripD};
    front={x:shF.x+dir.x*(ps.arm*0.94-kick)+out,y:shF.y+dir.y*(ps.arm*0.94-kick)};
  }else{
    front={x:shF.x+dir.x*(ps.arm*0.96-kick)+out,y:shF.y+dir.y*(ps.arm*0.96-kick)};
    const sw2=(opts&&opts.swing)||0;
    rear={x:shB.x-ps.arm*0.35*Math.cos(sw2)*0.6,y:shB.y+ps.arm*0.72};
    rear.x+=Math.sin(sw2)*ps.arm*0.45;
  }
  {
    const el=ik(shB.x,shB.y,rear.x,rear.y,ps.arm*0.5,ps.arm*0.5,1);
    limb(shB,el,armR*0.92,back(P.colSuit));
    limb(el,rear,armR*0.80,back(P.colSuit));
    if(P.gloveSize>0)dot(rear,armR*(0.85+0.4*P.gloveSize),back(P.colSuit2));
  }

  /* --- head --- */
  {
    const h=ps.hd,r=ps.headR,up=Math.sin(aim)*r*0.2;
    if(P.helmet==='none'){
      dot(h,r,P.colSkin);
      g.fillStyle=P.colSuit2;
      g.beginPath();g.arc(h.x-r*0.14,h.y-r*0.16,r*0.94,Math.PI*0.92,Math.PI*2.16);g.fill();
    }else if(P.helmet==='visor'){
      dot(h,r,P.colSkin);
      g.fillStyle=P.colSuit2;
      g.beginPath();g.arc(h.x,h.y,r*1.06,Math.PI*0.86,Math.PI*2.2);g.fill();
      g.save();g.translate(h.x,h.y);g.rotate(aim*0.35);
      g.fillStyle=P.colVisor;g.fillRect(-r*0.1,-r*0.32+up*0.2,r*1.25,r*0.42);
      g.restore();
    }else{
      dot(h,r*1.04,P.colSuit2);
      g.save();g.translate(h.x,h.y);g.rotate(aim*0.35);
      g.fillStyle=P.colVisor;
      g.beginPath();
      g.moveTo(r*0.05,-r*0.42);g.lineTo(r*1.05,-r*0.20);
      g.lineTo(r*1.05,r*0.30);g.lineTo(r*0.05,r*0.36);g.closePath();g.fill();
      g.restore();
      if(P.helmet==='crest'){
        g.fillStyle=P.colAccent;
        g.beginPath();g.moveTo(h.x-r*0.75,h.y-r*0.55);g.lineTo(h.x+r*0.2,h.y-r*1.5);
        g.lineTo(h.x+r*0.35,h.y-r*0.5);g.closePath();g.fill();
      }
    }
    if(P.antenna){
      g.strokeStyle=P.colSuit2;g.lineWidth=Math.max(1,H*0.018);g.lineCap='round';
      g.beginPath();g.moveTo(h.x-r*0.6,h.y-r*0.5);g.lineTo(h.x-r*1.05,h.y-r*2.0);g.stroke();
      dot({x:h.x-r*1.05,y:h.y-r*2.0},Math.max(1,H*0.026),P.colAccent);
    }
  }

  /* --- front leg --- */
  {
    const hip={x:ps.hipX+ps.hipW*0.30,y:ps.hipY};
    const knee=ik(hip.x,hip.y,ps.fF.x,ps.fF.y,ps.leg*0.5,ps.leg*0.5,-1);
    limb(hip,knee,legR,P.colSuit);
    limb(knee,ps.fF,legR*0.86,P.colSuit);
    if(P.bootSize>0){
      g.fillStyle=P.colSuit2;
      g.beginPath();g.ellipse(ps.fF.x+legR*0.3,ps.fF.y-legR*0.25,legR*(0.95+0.55*P.bootSize),legR*(0.75+0.32*P.bootSize),0,0,TAU);g.fill();
    }
  }

  /* --- weapon --- */
  const gripPt=P.twoHanded?rear:front;
  let muzzle={x:gripPt.x+dir.x*gs.len,y:gripPt.y+dir.y*gs.len};
  {
    g.save();g.translate(gripPt.x,gripPt.y);g.rotate(aim);
    const u=gs.u;
    const bh=Math.max(2,gs.h*0.55), rh=Math.max(3,gs.h);      // never let a part fall under a pixel
    g.fillStyle=shade(P.colGun,-0.22);                        // grip
    g.fillRect(-u*0.5,0,Math.max(1.6,u*1.4),gs.grip*0.8);
    g.fillStyle=shade(P.colGun,-0.14);                        // barrel (dark, so rim light reads as a tube)
    g.fillRect(-u*1.6,-bh*0.5,gs.len,bh);
    g.fillStyle=P.colGun;                                     // receiver
    g.fillRect(-u*1.6,-rh*0.5,gs.len*0.42,rh);
    if(gs.mag){g.fillStyle=shade(P.colGun,-0.3);g.fillRect(u*0.9,gs.h*0.3,u*1.1,gs.grip*0.7);}
    if(gs.scope){g.fillStyle=shade(P.colGun,-0.12);g.fillRect(u*0.2,-gs.h*0.95,gs.len*0.26,gs.h*0.42);
                 g.fillStyle=P.colVisor;g.fillRect(u*0.2+gs.len*0.2,-gs.h*0.9,u*0.5,gs.h*0.3);}
    if(gs.drum){g.fillStyle=shade(P.colGun,-0.15);g.beginPath();g.arc(gs.len*0.30,0,gs.h*0.72,0,TAU);g.fill();
                g.fillStyle=P.colAccent;g.beginPath();g.arc(gs.len*0.30,0,gs.h*0.26,0,TAU);g.fill();}
    if(P.muzzleBrake){g.fillStyle=shade(P.colGun,0.12);g.fillRect(gs.len-Math.max(1.6,u*1.5),-Math.max(1.6,gs.h*0.46),Math.max(1.6,u*1.5),Math.max(3.2,gs.h*0.92));}
    g.restore();
  }

  /* --- front arm --- */
  {
    const el=ik(shF.x,shF.y,front.x,front.y,ps.arm*0.5,ps.arm*0.5,1);
    limb(shF,el,armR,P.colSuit);
    limb(el,front,armR*0.88,P.colSuit);
    if(P.gloveSize>0)dot(front,armR*(0.9+0.45*P.gloveSize),P.colSuit2);
    if(P.pads>0){g.fillStyle=P.colAccent;
      g.beginPath();g.arc(shF.x,shF.y,H*0.030*P.pads,0,TAU);g.fill();}
  }
  return muzzle;
}

/* ---------- rasterise: alpha cut, palette snap, edge shade, outline ---------- */
function rasterise(ctx,w,h,pal){
  const img=ctx.getImageData(0,0,w,h),d=img.data,n=w*h;
  const idx=new Int16Array(n).fill(-1);
  for(let i=0,p=0;i<n;i++,p+=4){
    if(d[p+3]<115)continue;
    const key=(d[p]<<16)|(d[p+1]<<8)|d[p+2];
    let k=pal.cache.get(key);
    if(k===undefined){k=nearest(pal,d[p],d[p+1],d[p+2]);pal.cache.set(key,k);}
    idx[i]=k;
  }
  if(P.shading){
    const src=idx.slice();
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=y*w+x;if(src[i]<0)continue;
      const up=y>0?src[i-w]:-1, dn=y<h-1?src[i+w]:-1;
      if(up<0)idx[i]=pal.light[src[i]];
      else if(dn<0)idx[i]=pal.dark[src[i]];
    }
  }
  if(P.outline){
    const src=idx.slice();
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=y*w+x;if(src[i]>=0)continue;
      if((x>0&&src[i-1]>=0)||(x<w-1&&src[i+1]>=0)||(y>0&&src[i-w]>=0)||(y<h-1&&src[i+w]>=0))idx[i]=pal.outline;
    }
  }
  for(let i=0,p=0;i<n;i++,p+=4){
    const k=idx[i];
    if(k<0){d[p+3]=0;continue;}
    const c=pal.list[k];d[p]=c.r;d[p+1]=c.g;d[p+2]=c.b;d[p+3]=255;
  }
  ctx.putImageData(img,0,0);
}

/* ---------- sheet build ---------- */
let SHEET=null;
const measure=document.createElement('canvas');
const mctx=measure.getContext('2d',{willReadFrequently:true});

function aimAngles(){
  const n=P.aimRows,out=[];
  for(let i=0;i<n;i++)out.push(-90+180*i/(n-1));
  return out;
}
/* geometry key: colours never move a pixel, so a colour tweak reuses the measured cell */
function geoKey(){
  return [P.height,P.headSize,P.torsoLen,P.legLen,P.armLen,P.shoulderW,P.hipW,P.limbThick,
    P.bootSize,P.gloveSize,P.helmet,P.antenna,P.pads,P.backpack,P.plates,P.gun,P.gunSize,
    P.twoHanded,P.muzzleBrake,P.runFrames,P.stride,P.lift,P.bounce,P.lean,P.runLean,
    P.idleBob,P.tuck,P.aimRows,P.outline].join('|');
}
let boxCache={key:'',box:null};

function measureCell(cols,angles,pal){
  const H=P.height,gs=gunSpec();
  const reach=H*P.armLen+gs.len+H*(0.2+P.pads*0.1);
  const bigW=Math.ceil(H*1.2+reach*2),bigH=Math.ceil(H*1.6+reach*2);
  const ax0=Math.round(bigW*0.5),ay0=Math.round(bigH*0.62);
  measure.width=bigW;measure.height=bigH;
  mctx.clearRect(0,0,bigW,bigH);
  /* every frame stacked in one cell: the union of the ink is the tight cell, one readback */
  for(let r=0;r<angles.length;r++){
    const aim=angles[r]*Math.PI/180;
    for(let c=0;c<cols.length;c++){
      const col=cols[c];
      mctx.save();mctx.translate(ax0,ay0);
      const m=drawChar(mctx,pose(col.state,col.frame,col.frames,aim),pal,
              {swing:col.state==='run'?(col.frame/col.frames)*TAU:0,kick:0});
      mctx.fillStyle='#fff';mctx.fillRect(m.x-1,m.y-1,2,2);   // keep the muzzle point in frame
      mctx.restore();
    }
  }
  const md=mctx.getImageData(0,0,bigW,bigH).data;
  let x0=bigW,y0=bigH,x1=-1,y1=-1;
  for(let y=0;y<bigH;y++)for(let x=0;x<bigW;x++){
    if(md[(y*bigW+x)*4+3]>114){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  }
  if(x1<0){x0=y0=0;x1=y1=1;}
  const pad=P.outline?2:1;      // >=2 keeps one cell's outline out of its neighbour
  return {CW:(x1-x0+1)+pad*2, CH:(y1-y0+1)+pad*2, anchor:{x:ax0-x0+pad,y:ay0-y0+pad}};
}

function buildSheet(){
  const pal=buildPalette();
  const ST=states();
  const cols=[];
  ST.forEach(s=>{for(let f=0;f<s.frames;f++)cols.push({state:s.id,frame:f,frames:s.frames});});
  const angles=aimAngles();

  const key=geoKey();
  if(boxCache.key!==key)boxCache={key,box:measureCell(cols,angles,pal)};
  const {CW,CH,anchor}=boxCache.box;

  const sc=document.createElement('canvas');
  sc.width=CW*cols.length;sc.height=CH*angles.length;
  const sctx=sc.getContext('2d',{willReadFrequently:true});
  const muzzle=[];
  for(let r=0;r<angles.length;r++){
    const aim=angles[r]*Math.PI/180;
    muzzle[r]=[];
    for(let c=0;c<cols.length;c++){
      const col=cols[c];
      sctx.save();sctx.translate(c*CW+anchor.x,r*CH+anchor.y);
      const m=drawChar(sctx,pose(col.state,col.frame,col.frames,aim),pal,
              {swing:col.state==='run'?(col.frame/col.frames)*TAU:0,kick:0});
      sctx.restore();
      muzzle[r][c]={x:+(anchor.x+m.x).toFixed(2),y:+(anchor.y+m.y).toFixed(2)};
    }
  }
  rasterise(sctx,sc.width,sc.height,pal);   // one pass over the whole sheet

  SHEET={canvas:sc,CW,CH,cols,angles,anchor,muzzle,
         colOf:(state,frame)=>{
           let i=0;
           for(const s of ST){ if(s.id===state) return i+(frame%s.frames); i+=s.frames; }
           return 0;
         },
         framesOf:id=>(ST.find(s=>s.id===id)||ST[0]).frames,
         fpsOf:id=>(ST.find(s=>s.id===id)||ST[0]).fps};
  return SHEET;
}

/* ---------- UI ---------- */
const rail=document.getElementById('rail');
function buildUI(){
  rail.innerHTML='';
  CONTROLS.forEach((grp,gi)=>{
    const d=document.createElement('details');
    d.className='grp';d.open=gi<3||gi===5;
    d.innerHTML='<summary>'+grp.g+'</summary>';
    const box=document.createElement('div');
    grp.c.forEach(c=>box.appendChild(makeControl(c)));
    d.appendChild(box);rail.appendChild(d);
  });
}
function makeControl(c){
  const w=document.createElement('div');w.className='ctl';
  if(c.t==='colors'){
    const names=[['colSuit','suit'],['colSuit2','trim'],['colAccent','accent'],
                 ['colSkin','skin'],['colVisor','visor'],['colGun','metal'],['colOutline','outline']];
    const grid=document.createElement('div');grid.className='swatches';
    names.forEach(([k,l])=>{
      const s=document.createElement('label');s.className='sw';
      s.innerHTML='<span>'+l+'</span>';
      const i=document.createElement('input');i.type='color';i.value=P[k];
      i.addEventListener('input',()=>{P[k]=i.value;regen();});
      s.appendChild(i);grid.appendChild(s);
    });
    w.appendChild(grid);return w;
  }
  if(c.t==='buttons'){
    const mk=(label,cls,fn)=>{const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.onclick=fn;return b;};
    const r1=document.createElement('div');r1.className='row';
    r1.appendChild(mk('Randomize','hot',()=>{P.seed=(Math.random()*1e6)|0;randomize();}));
    r1.appendChild(mk('Re-roll seed','',()=>{P.seed=(Math.random()*1e6)|0;randomize();}));
    const r2=document.createElement('div');r2.className='row';r2.style.marginTop='6px';
    Object.keys(PRESETS).forEach(name=>r2.appendChild(mk(name,'',()=>{Object.assign(P,PRESETS[name]);buildUI();regen();})));
    w.appendChild(r1);w.appendChild(r2);return w;
  }
  const lab=document.createElement('label');
  if(c.t==='c'){
    w.className='ctl chk';
    const i=document.createElement('input');i.type='checkbox';i.checked=!!P[c.k];
    i.addEventListener('change',()=>{P[c.k]=i.checked;regen();});
    lab.style.justifyContent='flex-start';lab.style.gap='7px';
    lab.appendChild(i);lab.appendChild(document.createTextNode(c.l));
    w.appendChild(lab);return w;
  }
  const val=document.createElement('span');
  lab.innerHTML='<i style="font-style:normal">'+c.l+'</i>';
  lab.appendChild(val);w.appendChild(lab);
  if(c.t==='s'){
    const s=document.createElement('select');
    c.opt.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;s.appendChild(op);});
    s.value=String(P[c.k]);val.textContent='';
    s.addEventListener('change',()=>{P[c.k]=c.num?+s.value:s.value;regen();});
    w.appendChild(s);return w;
  }
  const i=document.createElement('input');
  i.type='range';i.min=c.min;i.max=c.max;i.step=c.step;i.value=P[c.k];
  const show=()=>{val.textContent=c.fmt?c.fmt(P[c.k]):(+P[c.k]).toFixed(c.step<0.05?3:c.step<1?2:0);};
  show();
  i.addEventListener('input',()=>{P[c.k]=+i.value;show();regen();});
  w.appendChild(i);return w;
}
function randomize(){
  const R=rng(P.seed);
  const pick=a=>a[(R()*a.length)|0];
  P.height=22+((R()*20)|0);
  P.headSize=0.8+R()*0.7;
  P.torsoLen=0.22+R()*0.16;
  P.legLen=0.34+R()*0.20;
  P.armLen=0.30+R()*0.20;
  P.shoulderW=0.20+R()*0.24;
  P.hipW=0.14+R()*0.14;
  P.limbThick=0.045+R()*0.05;
  P.bootSize=R()*1.6;P.gloveSize=R()*1.6;
  P.helmet=pick(['none','visor','full','crest']);
  P.backpack=pick(['none','tank','jet','pack']);
  P.gun=pick(['pistol','smg','rifle','cannon','beam']);
  P.gunSize=0.75+R()*0.8;
  P.twoHanded=R()>0.3;P.plates=R()>0.35;P.antenna=R()>0.65;P.muzzleBrake=R()>0.4;
  P.pads=R()*1.2;
  const h=R()*360, comp=(h+120+R()*140)%360;
  P.colSuit=hsl(h,18+R()*30,38+R()*16);
  P.colSuit2=hsl(h+(R()*20-10),22+R()*24,16+R()*10);
  P.colAccent=hsl(comp,55+R()*35,44+R()*14);
  P.colSkin=hsl(22+R()*14,32+R()*22,50+R()*24);
  P.colVisor=hsl((comp+40)%360,70+R()*25,58+R()*14);
  P.colGun=hsl(h+180,6+R()*10,40+R()*14);
  P.stride=0.18+R()*0.26;P.lift=0.06+R()*0.14;P.bounce=R()*0.05;
  P.runLean=2+R()*16;P.tuck=0.2+R()*0.45;
  buildUI();regen();
}

/* ---------- preview ---------- */
const pv=document.getElementById('preview'),pvx=pv.getContext('2d');
const stateBar=document.getElementById('statebar');
const aimSlider=document.getElementById('aimSlider'),aimLbl=document.getElementById('aimLbl');
let pvState='run',pvTime=0;
function buildStateBar(){
  stateBar.innerHTML='';
  states().forEach(s=>{
    const b=document.createElement('button');b.textContent=s.id;
    if(s.id===pvState)b.className='on';
    b.onclick=()=>{pvState=s.id;pvTime=0;buildStateBar();};
    stateBar.appendChild(b);
  });
}
function syncAim(){
  aimSlider.max=P.aimRows-1;
  if(+aimSlider.value>P.aimRows-1)aimSlider.value=(P.aimRows-1)>>1;
  aimLbl.textContent=Math.round(SHEET.angles[+aimSlider.value])+'°';
}
aimSlider.addEventListener('input',()=>{aimLbl.textContent=Math.round(SHEET.angles[+aimSlider.value])+'°';});

/* ---------- sheet view ---------- */
const sheetCv=document.getElementById('sheet'),sheetCtx=sheetCv.getContext('2d');
let sheetZoom=1;
document.getElementById('btnZoom').onclick=function(){
  sheetZoom=sheetZoom>=3?1:sheetZoom+1;this.textContent='Sheet zoom ×'+sheetZoom;drawSheetView();
};
function drawSheetView(){
  const s=SHEET.canvas;
  sheetCv.width=s.width*sheetZoom;sheetCv.height=s.height*sheetZoom;
  sheetCtx.imageSmoothingEnabled=false;
  sheetCtx.clearRect(0,0,sheetCv.width,sheetCv.height);
  sheetCtx.drawImage(s,0,0,sheetCv.width,sheetCv.height);
  document.getElementById('sheetInfo').textContent=
    SHEET.cols.length+' × '+SHEET.angles.length+' frames · '+s.width+'×'+s.height+'px';
  document.getElementById('cellInfo').textContent=SHEET.CW+'×'+SHEET.CH+' cell';
}
document.getElementById('btnPng').onclick=()=>{
  const a=document.createElement('a');
  a.download='mercforge_'+P.seed+'_'+SHEET.CW+'x'+SHEET.CH+'.png';
  a.href=SHEET.canvas.toDataURL('image/png');a.click();
};
document.getElementById('btnJson').onclick=()=>{
  const meta={
    generator:'MERC FORGE',seed:P.seed,
    cell:{w:SHEET.CW,h:SHEET.CH},anchor:SHEET.anchor,
    sheet:{w:SHEET.canvas.width,h:SHEET.canvas.height,cols:SHEET.cols.length,rows:SHEET.angles.length},
    rowsAreAimAngleDegrees:SHEET.angles,
    columns:SHEET.cols.map((c,i)=>({index:i,state:c.state,frame:c.frame})),
    animations:states().map(s=>({id:s.id,frames:s.frames,fps:s.fps,loop:s.loop,
      firstColumn:SHEET.colOf(s.id,0)})),
    muzzleOffsets:SHEET.muzzle,
    params:JSON.parse(JSON.stringify(P))
  };
  const b=new Blob([JSON.stringify(meta,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.download='mercforge_'+P.seed+'.json';
  a.href=URL.createObjectURL(b);a.click();

function regen(){
  clearTimeout(regenTimer);
  regenTimer=setTimeout(()=>{
    buildSheet();syncAim();drawSheetView();paintLevel();
    document.getElementById('cellInfo').textContent=SHEET.CW+'×'+SHEET.CH+' cell';
  },70);

/* ============================================================
   DEMO — small platformer, mouse aim, keyboard movement
   ============================================================ */
const TILE=16,LW=72,LH=24;
const grid=new Uint8Array(LW*LH);
const at=(x,y)=>(x<0||y<0||x>=LW||y>=LH)?1:grid[y*LW+x];
function fillRect(x,y,w,h,v){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(i>=0&&j>=0&&i<LW&&j<LH)grid[j*LW+i]=v;}
function buildLevel(){
  grid.fill(0);
  fillRect(0,0,LW,1,1);fillRect(0,LH-2,LW,2,1);
  fillRect(0,0,1,LH,1);fillRect(LW-1,0,1,LH,1);
  const blocks=[[6,19,5,1],[12,16,4,1],[18,13,5,1],[24,17,6,1],[30,14,3,1],[26,10,7,1],
                [34,19,8,2],[38,15,4,1],[44,11,6,1],[46,17,5,1],[52,20,7,2],[54,15,5,1],
                [58,11,4,1],[62,17,6,1],[64,13,4,1],[9,11,5,1],[3,14,4,1],[16,8,6,1],
                [40,7,7,1],[20,20,4,2],[68,19,3,3],[33,5,5,1]];
  blocks.forEach(b=>fillRect(b[0],b[1],b[2],b[3],1));
  fillRect(11,20,2,2,1);fillRect(48,19,2,3,1);
}
buildLevel();

const levelCv=document.createElement('canvas');
levelCv.width=LW*TILE;levelCv.height=LH*TILE;
const lctx=levelCv.getContext('2d');
function paintLevel(){
  const R=rng(99);
  lctx.clearRect(0,0,levelCv.width,levelCv.height);
  const base=shade(P.colSuit2,-0.25),top=shade(P.colSuit,-0.15),deep=shade(P.colSuit2,-0.5);
  for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){
    if(!at(x,y))continue;
    const px=x*TILE,py=y*TILE;
    lctx.fillStyle=base;lctx.fillRect(px,py,TILE,TILE);
    lctx.fillStyle=deep;
    for(let k=0;k<3;k++){const a=(R()*TILE)|0,b=(R()*TILE)|0,w=1+((R()*4)|0);
      lctx.fillRect(px+a,py+b,w,1+((R()*3)|0));}
    if(!at(x,y-1)){
      lctx.fillStyle=top;lctx.fillRect(px,py,TILE,3);
      lctx.fillStyle=P.colAccent;
      if(R()>0.72)lctx.fillRect(px+2+((R()*10)|0),py+1,2,1);
    }
    lctx.fillStyle='rgba(0,0,0,.28)';
    if(!at(x-1,y))lctx.fillRect(px,py,1,TILE);
    if(!at(x+1,y))lctx.fillRect(px+TILE-1,py,1,TILE);
    if(!at(x,y+1))lctx.fillRect(px,py+TILE-1,TILE,1);
  }
}

const demo=document.getElementById('demo'),dx=demo.getContext('2d');
const VW=480,VH=270;
const keys={},mouse={x:VW/2,y:VH/2,down:false};
const player={x:80,y:200,vx:0,vy:0,ground:false,face:1,anim:'idle',t:0,phase:0,coyote:0,fire:0,kick:0,hp:100};
let cam={x:0,y:0},shake=0;
const bullets=[],parts=[],bots=[];
function spawnBots(){
  bots.length=0;
  [[300,240],[520,180],[700,150],[880,230],[1020,190],[430,120],[760,90]].forEach(p=>
    bots.push({x:p[0],y:p[1],hy:p[1],hp:3,t:Math.random()*TAU,dead:0,dir:Math.random()>0.5?1:-1}));
}
spawnBots();

addEventListener('keydown',e=>{
  keys[e.code]=true;
  const el=document.activeElement,tag=el&&el.tagName;
  const typing=tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA';
  if(!typing&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='KeyR'){player.x=80;player.y=200;player.vx=player.vy=0;spawnBots();}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
demo.addEventListener('mousemove',e=>{
  const r=demo.getBoundingClientRect();          // canvas is object-fit:contain, so undo the letterbox
  const s=Math.min(r.width/demo.width,r.height/demo.height);
  mouse.x=clamp((e.clientX-r.left-(r.width-demo.width*s)/2)/s/2,0,VW);
  mouse.y=clamp((e.clientY-r.top-(r.height-demo.height*s)/2)/s/2,0,VH);
});
demo.addEventListener('mousedown',e=>{mouse.down=true;e.preventDefault();demo.focus();});
addEventListener('mouseup',()=>{mouse.down=false;});
demo.addEventListener('contextmenu',e=>e.preventDefault());
demo.tabIndex=0;

function solidAt(px,py){return at(Math.floor(px/TILE),Math.floor(py/TILE))===1;}
function moveBox(o,w,h){
  o.x+=o.vx;
  const sx=o.vx>0?1:-1;
  if(o.vx!==0){
    const edge=o.x+(sx>0?w/2:-w/2);
    for(let yy=o.y-h;yy<=o.y-1;yy+=6){
      if(solidAt(edge,yy)){o.x=sx>0?Math.floor(edge/TILE)*TILE-w/2-0.01:(Math.floor(edge/TILE)+1)*TILE+w/2+0.01;o.vx=0;break;}
    }
    if(solidAt(edge,o.y-1)){o.x=sx>0?Math.floor(edge/TILE)*TILE-w/2-0.01:(Math.floor(edge/TILE)+1)*TILE+w/2+0.01;o.vx=0;}
  }
  o.y+=o.vy;o.ground=false;
  if(o.vy>=0){
    for(let xx=o.x-w/2+1;xx<=o.x+w/2-1;xx+=5){
      if(solidAt(xx,o.y)){o.y=Math.floor(o.y/TILE)*TILE-0.01;o.vy=0;o.ground=true;break;}
    }
  }else{
    for(let xx=o.x-w/2+1;xx<=o.x+w/2-1;xx+=5){
      if(solidAt(xx,o.y-h)){o.y=(Math.floor((o.y-h)/TILE)+1)*TILE+h+0.01;o.vy=0;break;}
    }
  }
}

function update(dt){
  const H=P.height, PW=Math.max(6,H*0.32), PH=H*0.90;
  const crouch=keys.KeyS||keys.ArrowDown;
  const spd=crouch?0.55:1;
  const want=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  player.vx+=want*0.55*spd;
  player.vx*=player.ground?0.80:0.90;
  if(Math.abs(player.vx)<0.02)player.vx=0;
  player.vx=clamp(player.vx,-2.6*spd,2.6*spd);
  player.vy+=0.36;player.vy=Math.min(player.vy,9);
  if(player.ground)player.coyote=8;else player.coyote--;
  if((keys.KeyW||keys.Space||keys.ArrowUp)&&player.coyote>0){player.vy=-6.1;player.coyote=0;}
  const wasAir=!player.ground;
  moveBox(player,PW,PH);
  if(player.y>LH*TILE+40){player.x=80;player.y=200;player.vy=0;}

  // aim
  const shoulderX=player.x,shoulderY=player.y-PH*0.72;
  const wmx=mouse.x+cam.x,wmy=mouse.y+cam.y;
  const adx=wmx-shoulderX,ady=wmy-shoulderY;
  const aim=Math.atan2(ady,adx);
  if(Math.abs(adx)>3)player.face=adx>0?1:-1;
  let local=player.face>0?aim:(aim>0?Math.PI-aim:-Math.PI-aim);
  local=clamp(local,-Math.PI/2,Math.PI/2);
  player.aim=aim;player.local=local;

  // anim state
  let st='idle';
  if(!player.ground)st=player.vy<0?'jump':'fall';
  else if(crouch)st='crouch';
  else if(Math.abs(player.vx)>0.25)st='run';
  if(player.ground&&wasAir&&Math.abs(player.vy)<1&&st==='idle'){player.land=10;}
  if(player.land>0){player.land--;st='land';}
  if(st!==player.anim){player.anim=st;player.t=0;}
  player.t+=dt;
  if(st==='run')player.phase+=Math.abs(player.vx)*dt*0.9;

  // shooting
  player.fire-=dt;player.kick*=0.86;
  if(mouse.down&&player.fire<=0){
    player.fire={pistol:0.22,smg:0.075,rifle:0.11,cannon:0.42,beam:0.06}[P.gun];
    player.kick=1;shake=Math.min(3,shake+(P.gun==='cannon'?2.2:0.7));
    const row=aimRow(local),col=SHEET.colOf(player.anim,frameOf(player));
    const mu=SHEET.muzzle[row][col];
    const mx=player.face>0?mu.x-SHEET.anchor.x:-(mu.x-SHEET.anchor.x);
    const my=mu.y-SHEET.anchor.y;
    const bx=player.x+mx,by=player.y+my;
    const spread=(P.gun==='smg'?0.06:P.gun==='beam'?0.01:0.025)*(Math.random()-0.5)*2;
    const a=aim+spread;
    const spdB=P.gun==='beam'?9:P.gun==='cannon'?4.2:6.4;
    bullets.push({x:bx,y:by,vx:Math.cos(a)*spdB,vy:Math.sin(a)*spdB,life:1.1,
                  big:P.gun==='cannon',beam:P.gun==='beam'});
    for(let i=0;i<4;i++)parts.push({x:bx,y:by,vx:Math.cos(a)*(1+Math.random()*2)+(Math.random()-0.5),
      vy:Math.sin(a)*(1+Math.random()*2)+(Math.random()-0.5),life:0.12+Math.random()*0.1,c:P.colVisor,g:0});
  }

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.life-=dt;
    for(let s=0;s<2;s++){
      b.x+=b.vx/2;b.y+=b.vy/2;
      if(solidAt(b.x,b.y)){impact(b,-b.vx,-b.vy);bullets.splice(i,1);b.dead=1;break;}
    }
    if(b.dead)continue;
    for(const e of bots){
      if(e.dead)continue;
      if(Math.abs(b.x-e.x)<7&&Math.abs(b.y-e.y)<7){
        e.hp-=b.big?3:1;impact(b,-b.vx,-b.vy);bullets.splice(i,1);b.dead=1;
        if(e.hp<=0){e.dead=2.5;boom(e.x,e.y);}
        break;
      }
    }
    if(!b.dead&&b.life<=0)bullets.splice(i,1);
  }
  // bots
  for(const e of bots){
    if(e.dead>0){e.dead-=dt;if(e.dead<=0){e.hp=3;e.x=e.hx||e.x;e.dead=0;}continue;}
    e.t+=dt*2;e.y=e.hy+Math.sin(e.t)*7;
    e.x+=e.dir*0.35;
    if(solidAt(e.x+e.dir*8,e.y)||e.x<20||e.x>LW*TILE-20)e.dir*=-1;
  }
  // particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;p.vx*=0.94;p.vy*=0.94;
    if(p.life<=0)parts.splice(i,1);
  }
  shake*=0.85;
  cam.x+=((player.x-VW/2+(mouse.x-VW/2)*0.22)-cam.x)*0.12;
  cam.y+=((player.y-VH/2-10+(mouse.y-VH/2)*0.18)-cam.y)*0.12;
  cam.x=clamp(cam.x,0,LW*TILE-VW);cam.y=clamp(cam.y,0,LH*TILE-VH);
}
function impact(b,vx,vy){
  const n=b.big?14:6;
  for(let i=0;i<n;i++)parts.push({x:b.x,y:b.y,
    vx:(vx/6)*(Math.random()*0.6)+(Math.random()-0.5)*2.2,
    vy:(vy/6)*(Math.random()*0.6)+(Math.random()-0.5)*2.2,
    life:0.18+Math.random()*0.25,c:i%3?P.colVisor:P.colAccent,g:0.06});
}
function boom(x,y){
  shake=4;
  for(let i=0;i<26;i++){const a=Math.random()*TAU,s=0.5+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.35+Math.random()*0.5,
      c:i%2?P.colAccent:P.colVisor,g:0.09});}
}
function aimRow(local){
  const deg=local*180/Math.PI;
  const n=SHEET.angles.length;
  return clamp(Math.round((deg+90)/180*(n-1)),0,n-1);
}
function frameOf(pl){
  const f=SHEET.framesOf(pl.anim);
  if(pl.anim==='run')return Math.floor(pl.phase)%f;
  return Math.floor(pl.t*SHEET.fpsOf(pl.anim))%f;
}
function blit(ctx,col,row,x,y,flip){
  const s=SHEET,sx=col*s.CW,sy=row*s.CH;
  if(flip){ctx.save();ctx.translate(Math.round(x)+s.CW,Math.round(y));ctx.scale(-1,1);
    ctx.drawImage(s.canvas,sx,sy,s.CW,s.CH,0,0,s.CW,s.CH);ctx.restore();}
  else ctx.drawImage(s.canvas,sx,sy,s.CW,s.CH,Math.round(x),Math.round(y),s.CW,s.CH);
}
function render(){
  dx.save();dx.imageSmoothingEnabled=false;dx.scale(2,2);
  const g=dx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,shade(P.colSuit2,-0.62));g.addColorStop(1,shade(P.colSuit2,-0.82));
  dx.fillStyle=g;dx.fillRect(0,0,VW,VH);
  const ox=Math.round(-cam.x+(Math.random()-0.5)*shake),oy=Math.round(-cam.y+(Math.random()-0.5)*shake);
  // parallax girder lattice
  dx.fillStyle=shade(P.colSuit2,-0.52);
  const sp=104,bp=84;
  const gx0=-((cam.x*0.4)%sp+sp)%sp, gy0=-((cam.y*0.4)%bp+bp)%bp;
  for(let i=-1;i<=VW/sp+1;i++){
    const gx=Math.round(gx0+i*sp);
    dx.fillRect(gx,0,5,VH);
    for(let j=-1;j<=VH/bp+1;j++)dx.fillRect(gx-16,Math.round(gy0+j*bp),37,3);
  }
  dx.save();dx.translate(ox,oy);
  dx.drawImage(levelCv,0,0);
  // bots
  for(const e of bots){
    if(e.dead>0)continue;
    dx.fillStyle=shade(P.colGun,-0.1);dx.fillRect(e.x-6,e.y-5,12,10);
    dx.fillStyle=P.colOutline;dx.fillRect(e.x-6,e.y-5,12,1);
    dx.fillStyle=e.hp<3?P.colAccent:P.colVisor;
    dx.fillRect(e.x-3+(e.dir>0?2:-2),e.y-2,4,3);
    dx.fillStyle=shade(P.colGun,-0.35);dx.fillRect(e.x-8,e.y+5,16,2);
  }
  // player
  const row=aimRow(player.local),col=SHEET.colOf(player.anim,frameOf(player));
  const flip=player.face<0;
  const bx=player.x-(flip?(SHEET.CW-SHEET.anchor.x):SHEET.anchor.x);
  const by=player.y-SHEET.anchor.y;
  blit(dx,col,row,bx,by,flip);
  // muzzle flash
  if(player.kick>0.25){
    const mu=SHEET.muzzle[row][col];
    const mx=player.x+(flip?-(mu.x-SHEET.anchor.x):(mu.x-SHEET.anchor.x));
    const my=player.y+(mu.y-SHEET.anchor.y);
    dx.save();dx.translate(mx,my);dx.rotate(player.aim);
    dx.fillStyle=P.colVisor;
    const r=player.kick*(P.gun==='cannon'?7:4);
    dx.beginPath();dx.moveTo(0,-r*0.5);dx.lineTo(r*1.8,0);dx.lineTo(0,r*0.5);
    dx.lineTo(r*0.4,0);dx.closePath();dx.fill();
    dx.restore();
  }
  // bullets
  for(const b of bullets){
    dx.strokeStyle=b.beam?P.colVisor:P.colAccent;
    dx.lineWidth=b.big?3:b.beam?1:2;dx.lineCap='round';
    dx.beginPath();dx.moveTo(b.x,b.y);dx.lineTo(b.x-b.vx*1.4,b.y-b.vy*1.4);dx.stroke();
  }
  for(const p of parts){dx.fillStyle=p.c;const s=p.life>0.25?2:1;dx.fillRect(p.x|0,p.y|0,s,s);}
  dx.restore();
  // crosshair
  dx.strokeStyle=P.colVisor;dx.lineWidth=1;
  dx.beginPath();
  dx.moveTo(mouse.x-5,mouse.y);dx.lineTo(mouse.x-2,mouse.y);
  dx.moveTo(mouse.x+2,mouse.y);dx.lineTo(mouse.x+5,mouse.y);
  dx.moveTo(mouse.x,mouse.y-5);dx.lineTo(mouse.x,mouse.y-2);
  dx.moveTo(mouse.x,mouse.y+2);dx.lineTo(mouse.x,mouse.y+5);
  dx.stroke();
  dx.restore();
  document.getElementById('demoHud').innerHTML=
    'state <b>'+player.anim+'</b> · frame <b>'+frameOf(player)+'</b> · sheet cell <b>col '+col+', row '+row+
    '</b> · aim <b>'+Math.round(SHEET.angles[row])+'°</b> · facing <b>'+(flip?'left':'right')+'</b>';
}

/* ---------- preview draw ---------- */
function drawPreview(dt){
  const s=SHEET,z=clamp(Math.floor(190/Math.max(s.CW,s.CH)),1,6);
  if(pv.width!==s.CW*z||pv.height!==s.CH*z){pv.width=s.CW*z;pv.height=s.CH*z;}
  pvx.imageSmoothingEnabled=false;
  pvx.clearRect(0,0,pv.width,pv.height);
  pvTime+=dt;
  const nf=s.framesOf(pvState);
  const f=Math.floor(pvTime*P.previewFps)%nf;
  const col=s.colOf(pvState,f),row=clamp(+aimSlider.value,0,s.angles.length-1);
  pvx.drawImage(s.canvas,col*s.CW,row*s.CH,s.CW,s.CH,0,0,pv.width,pv.height);
}

/* ---------- main loop ---------- */
let last=performance.now(),acc=0;
const STEP=1/60;
function loop(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(SHEET){
    acc+=dt;
    let n=0;
    while(acc>=STEP&&n<4){update(STEP);acc-=STEP;n++;}   // fixed step: same feel at any refresh rate
    render();
    drawPreview(dt);
  }
  requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
buildUI();buildStateBar();buildSheet();syncAim();drawSheetView();paintLevel();
requestAnimationFrame(loop);
</script>
